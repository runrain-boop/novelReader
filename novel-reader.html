<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>📖 小說閱讀器</title>
<style>
:root{--bg:#f5f0e8;--sf:#ede7db;--pn:#e4ddd0;--bd:#d0c8b8;--ac:#8b6914;--tx:#2a2018;--txd:#7a6e5f;--txr:#b8aa98;--err:#c05050;--ok:#4a9060;--warn:#9a7820;--serif:-apple-system,'PingFang TC','Segoe UI',sans-serif;--ui:-apple-system,'PingFang TC','Segoe UI',sans-serif;--sw:270px;--pm:680px;--fs:18px;--lh:1.95;--safe-b:env(safe-area-inset-bottom,0px)}
body.dk{--bg:#1c1812;--sf:#252018;--pn:#2e2820;--bd:#3e3828;--ac:#c9a96e;--tx:#ede3d5;--txd:#9a8f82;--txr:#504540}
body.ge{--bg:#d4ecd4;--sf:#c8e4c8;--pn:#bcdabc;--bd:#a0caa0;--ac:#2a6a2a;--tx:#0a200a;--txd:#3a6a3a;--txr:#6a9a6a}
body.sp{--bg:#f2e8d8;--sf:#e8dccc;--pn:#ddd0bc;--bd:#c8bca8;--ac:#7a4e18;--tx:#2a1808;--txd:#6a5040;--txr:#a89080}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-text-size-adjust:100%}
#app{display:flex;height:100%;height:100dvh}

/* Sidebar */
#sb{width:var(--sw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .26s ease;z-index:20}
#sb.col{transform:translateX(-100%);position:absolute;height:100%}
#sb-close{background:none;border:none;color:var(--txd);font-size:18px;cursor:pointer;padding:3px 7px;border-radius:5px;flex-shrink:0;line-height:1;-webkit-appearance:none}
#sb-close:hover{color:var(--tx)}
@media(max-width:680px){#sb-close{display:none}}
#sbh{padding:14px 12px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px}
#sbh h1{font-size:13px;font-weight:700;color:var(--ac);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#fetch-badge{font-size:10px;padding:2px 6px;border-radius:8px;white-space:nowrap;flex-shrink:0;display:none}
#fetch-badge.loading{background:rgba(139,105,20,.15);color:var(--warn);display:inline-block}
#fetch-badge.done{background:rgba(74,144,96,.15);color:var(--ok);display:inline-block}
#fetch-badge.err{background:rgba(192,80,80,.15);color:var(--err);display:inline-block}
#tcq{margin:8px 10px;padding:8px 12px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:15px;outline:none;width:calc(100% - 20px);-webkit-appearance:none}
#tcq:focus{border-color:var(--ac)}
#tcl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.ti{padding:11px 13px;cursor:pointer;color:var(--tx);border-left:3px solid transparent;user-select:none;display:flex;align-items:center;gap:6px}
.ti:active{background:var(--pn)}
.ti.active{border-left-color:var(--ac);color:var(--ac);background:var(--pn);font-weight:700}
.ti.read{color:var(--txr)}
.ti.loading{color:var(--warn)}
.ti-body{flex:1;overflow:hidden}
.ti-meta{font-size:11px;color:var(--txr);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.ti-check{color:var(--ok);font-weight:700}
.ti-title{font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.35}
.ti-edit{font-size:14px;padding:2px 5px;cursor:pointer;opacity:0;flex-shrink:0;color:var(--ac)}
.ti:hover .ti-edit{opacity:.7}
.ti-edit:hover{opacity:1}
.ti-del{font-size:14px;padding:2px 5px;cursor:pointer;opacity:0;flex-shrink:0;color:var(--err)}
.ti:hover .ti-del{opacity:.7}
.ti-del:hover{opacity:1}
#sbf{padding:9px 12px;border-top:1px solid var(--bd);font-size:13px;color:var(--txd);text-align:center;padding-bottom:calc(9px + var(--safe-b))}

/* Main */
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0}
.btn{background:none;border:1px solid var(--bd);color:var(--txd);padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap;-webkit-appearance:none;user-select:none;transition:all .12s}
.btn:active,.btn:hover{color:var(--tx);border-color:var(--ac)}
.btn.on{color:var(--ac);border-color:var(--ac);background:rgba(139,105,20,.1)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 2px;flex-shrink:0}
#chtl{flex:1;font-size:13px;color:var(--txd);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}

/* Reader */
#rw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
#rw::-webkit-scrollbar{display:none}
#rc{display:none;max-width:var(--pm);margin:0 auto;padding:32px 24px 100px}
#chhd{font-size:19px;font-family:var(--serif);color:var(--ac);margin-bottom:22px;line-height:1.5;text-align:center;border-bottom:1px solid var(--bd);padding-bottom:14px}
#nt{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx)}
#nt p{margin-bottom:.85em;text-indent:2em}

/* Welcome / Shelf */
#wc{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* Shelf */
#shelf-view{flex:1;display:none;flex-direction:column;overflow:hidden}
#shelf-header{padding:12px 14px 0;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0}
#shelf-tabs{display:flex;gap:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:10px;width:fit-content}
.stab{padding:7px 16px;background:var(--pn);border:none;color:var(--txd);font-size:13px;cursor:pointer;-webkit-appearance:none;user-select:none;transition:all .12s;white-space:nowrap}
.stab.active{background:var(--ac);color:#fff;font-weight:700}
#shelf-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;padding-bottom:calc(12px + var(--safe-b))}
#shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
@media(max-width:500px){#shelf-grid{grid-template-columns:repeat(2,1fr);gap:9px}}
#shelf-empty{text-align:center;padding:40px 16px;color:var(--txd);font-size:14px;display:none;line-height:1.7}

/* Shelf card */
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s;position:relative;display:flex;flex-direction:column}
.sc:active{transform:scale(.97)}
.sc.cur{border-color:var(--ac);box-shadow:0 0 0 2px rgba(139,105,20,.2)}
.sc-cover{height:110px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pn),var(--bd));flex-shrink:0}
.sc-body{padding:9px 10px;flex:1;display:flex;flex-direction:column}
.sc-title{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;margin-bottom:4px;flex:1}
.sc-author{font-size:11px;color:var(--txd);margin-bottom:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sc-bar-wrap{height:3px;background:var(--bd);border-radius:2px;margin-bottom:5px}
.sc-bar{height:100%;background:var(--ac);border-radius:2px}
.sc-foot{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.sc-stat{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}
.sc-stat.reading{background:rgba(139,105,20,.15);color:var(--ac)}
.sc-stat.want{background:rgba(96,96,192,.15);color:#6060c0}
.sc-stat.done{background:rgba(74,144,96,.15);color:var(--ok)}
.sc-prog{font-size:10px;color:var(--txr)}
/* Status buttons inside card */
.sc-status-row{display:flex;gap:4px}
.ssb{flex:1;padding:4px 0;border-radius:5px;border:1px solid var(--bd);font-size:11px;cursor:pointer;background:var(--pn);color:var(--txd);-webkit-appearance:none;text-align:center;transition:all .1s}
.ssb:active{opacity:.7}
.ssb.sw{border-color:#6060c0;color:#6060c0;background:rgba(96,96,192,.1);font-weight:700}
.ssb.sr{border-color:var(--ac);color:var(--ac);background:rgba(139,105,20,.1);font-weight:700}
.ssb.sd{border-color:var(--ok);color:var(--ok);background:rgba(74,144,96,.1);font-weight:700}
/* Badges */
.sc-now{position:absolute;top:6px;left:6px;background:var(--ac);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700}
.sc-del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;display:flex!important;align-items:center;justify-content:center;opacity:.8;z-index:10}
.sc-del:active{background:var(--err);opacity:1}

/* Add view */
#add-view{display:none;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(14px + var(--safe-b))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:15px;margin-bottom:10px}
.card h3{font-size:13px;color:var(--ac);margin-bottom:11px;font-weight:700}
.inp{flex:1;padding:10px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;outline:none;-webkit-appearance:none;min-width:0}
.inp:focus{border-color:var(--ac)}
.irow{display:flex;gap:7px;margin-bottom:9px}
.gbtn{padding:10px 15px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;user-select:none;flex-shrink:0}
.gbtn:active{opacity:.8}
#flog{background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--txd);max-height:130px;overflow-y:auto;display:none;line-height:1.65}
#fprogw{width:100%;height:4px;background:var(--bd);border-radius:2px;margin:7px 0;display:none}
#fprogf{height:100%;background:var(--ac);border-radius:2px;transition:width .35s;width:0%}
#fetch-help{font-size:12px;color:var(--txd);margin-top:10px;line-height:1.8;padding:8px 10px;background:var(--pn);border:1px solid var(--bd);border-radius:7px}
#fetch-help b{color:var(--warn)}
#fetch-help a{color:var(--acc);text-decoration:none;display:inline-block;margin-right:10px}
#fetch-help a:hover{text-decoration:underline}
#fetch-help .fh-note{color:var(--txd);font-size:11px;margin-top:4px}

/* Bottom nav (scroll mode) */
#bb{height:calc(52px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 13px;padding-bottom:var(--safe-b);flex-shrink:0}
.nb{background:var(--pn);border:1px solid var(--bd);color:var(--txd);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;-webkit-appearance:none;user-select:none}
.nb:active{background:var(--ac);color:#fff;border-color:var(--ac)}
.nb:disabled{opacity:.25;pointer-events:none}
#pind{font-size:12px;color:var(--txd);text-align:center}
#pgw{width:90px;height:3px;background:var(--bd);border-radius:2px;margin-top:4px}
#pg{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}

/* Page mode */
#pw{display:none;height:100%;flex-direction:column;overflow:hidden;position:relative}
#pbook{flex:1;display:flex;overflow:hidden}
#pscreen{flex:1;display:flex;flex-direction:column;padding:28px 26px 0;overflow:hidden;transition:transform .16s ease}
#pscreen-r{display:none;flex:1;flex-direction:column;padding:28px 26px 0;overflow:hidden;transition:transform .16s ease;border-left:2px solid var(--bd)}
.twopage #pscreen-r{display:flex}
@media(max-width:680px){#pscreen,#pscreen-r{padding:18px 16px 0}}
#pchtitle,#pchtitle-r{font-size:13px;color:var(--txd);text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-shrink:0}
#ptext,#ptext-r{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx);flex:1;overflow:hidden;user-select:text;-webkit-user-select:text}
#nt{user-select:text;-webkit-user-select:text}
#ptext p,#ptext-r p{margin-bottom:.85em;text-indent:2em}
@media(min-width:681px){#tap-l,#tap-r{display:none}}
#pnav{height:calc(58px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-bottom:var(--safe-b);flex-shrink:0;gap:10px}
.pnb{background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:9px 20px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:700;-webkit-appearance:none;user-select:none;white-space:nowrap;flex-shrink:0}
.pnb:active{background:var(--ac);color:#fff;border-color:var(--ac)}
.pnb:disabled{opacity:.2;pointer-events:none}
#pmid{text-align:center;flex:1;min-width:0}
#pmid-ch{font-size:12px;color:var(--txd);margin-bottom:2px}
#pmid-pg{font-size:11px;color:var(--txr)}
#pdots{display:flex;gap:3px;align-items:center;justify-content:center;margin-top:3px}
.pdot{width:4px;height:4px;border-radius:50%;background:var(--bd)}
.pdot.on{background:var(--ac);width:6px;height:6px}
#tap-l{position:absolute;left:0;top:0;width:28%;height:calc(100% - 58px - var(--safe-b));z-index:5;cursor:pointer}
#tap-r{position:absolute;right:0;top:0;width:28%;height:calc(100% - 58px - var(--safe-b));z-index:5;cursor:pointer}

/* Panels */
.panel{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:15px;box-shadow:0 6px 28px rgba(0,0,0,.15);display:none;z-index:40}
.panel.show{display:block}
.panel h4{font-size:13px;color:var(--ac);margin-bottom:12px;font-weight:700}
#ttp{bottom:68px;right:12px;width:228px}
#setp{top:58px;right:12px;width:252px}
#expp{top:58px;right:12px;width:272px}
#editp{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#editp.show{display:flex}
#edit-box{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
#edit-box h4{font-size:16px;font-weight:700;color:var(--ac);margin-bottom:14px}
.ef{margin-bottom:10px}
.ef label{font-size:12px;color:var(--txd);display:block;margin-bottom:4px;font-weight:600}
.ef input,.ef textarea{width:100%;padding:9px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:14px;outline:none;-webkit-appearance:none}
.ef textarea{height:80px;resize:none;font-family:var(--ui)}
.ef input:focus,.ef textarea:focus{border-color:var(--ac)}
.edit-chlist{max-height:260px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;background:var(--pn);margin-top:6px}
.ech-toolbar{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:0;z-index:1}
.ech-selall{background:var(--pn);border:1px solid var(--bd);border-radius:5px;font-size:12px;padding:4px 9px;cursor:pointer;color:var(--txd);-webkit-appearance:none;white-space:nowrap}
.ech-selall:active{border-color:var(--ac);color:var(--ac)}
.ech-count{flex:1;font-size:12px;color:var(--txd)}
.ech-delbtn{background:var(--err);color:#fff;border:none;border-radius:5px;font-size:12px;padding:4px 10px;cursor:pointer;font-weight:600;-webkit-appearance:none;white-space:nowrap}
.ech-delbtn:disabled{opacity:.3;cursor:default}
.ech-row{display:flex;align-items:center;padding:8px 11px;border-bottom:1px solid var(--bd);gap:8px;cursor:pointer;transition:background .1s}
.ech-row:last-child{border-bottom:none}
.ech-row.checked{background:rgba(139,105,20,.08)}
.ech-cb{width:20px;height:20px;border:2px solid var(--bd);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;background:var(--pn)}
.ech-cb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ech-cb.on::after{content:'✓';font-weight:700}
.ech-num{font-size:11px;color:var(--txr);width:30px;flex-shrink:0}
.ech-title{flex:1;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.edit-btns{display:flex;gap:8px;margin-top:14px}
.edit-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}

/* TTS */
.tr{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;color:var(--txd)}
.tr label{width:46px;flex-shrink:0}
.tr input[type=range]{flex:1;accent-color:var(--ac);height:20px}
.tr span{width:30px;text-align:right;font-size:11px;color:var(--tx)}
#tvsel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:6px;font-size:12px;margin-bottom:9px;outline:none;-webkit-appearance:none}
#tplaybtn{width:100%;padding:8px;background:var(--ac);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}

/* Settings */
.srow{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12.5px;color:var(--txd)}
.srow label{flex:1}
.srow input[type=range]{width:82px;accent-color:var(--ac);height:20px}
.srow span{width:30px;font-size:11px;color:var(--tx);text-align:right}
.thr{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.thb{padding:5px 10px;border-radius:6px;border:1px solid var(--bd);font-size:12px;cursor:pointer;background:var(--pn);color:var(--txd);-webkit-appearance:none}
.thb.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.cbtn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.cbtn.on{border-color:var(--ac)}

/* Export */
.exp-sel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:7px 9px;border-radius:7px;font-size:13px;outline:none;-webkit-appearance:none;margin-bottom:10px}
.exp-btns{display:flex;gap:7px}
.exp-btns button{flex:1;padding:9px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none}
#exp-stat{font-size:12px;color:var(--txd);margin-top:8px;min-height:16px}

/* Misc */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
#overlay.show{display:block}
#kh{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;border-radius:6px;padding:5px 13px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;white-space:nowrap}
#kh.show{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:680px){:root{--sw:82vw;--fs:16px}#sb{position:absolute;height:100%;transform:translateX(-110%)}#sb.open{transform:translateX(0)}#rc{padding:22px 15px 100px}#setp,#expp{top:auto;bottom:68px;right:12px;left:12px;width:auto}#topbar{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}#topbar::-webkit-scrollbar{display:none}#topbar .btn{flex-shrink:0}}
/* Notes */
#note-popup{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;box-shadow:0 4px 24px rgba(0,0,0,.18);z-index:65;display:none;width:272px;max-width:92vw}
.nc{display:inline-block;width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.nc.on{transform:scale(1.2);border-color:rgba(0,0,0,.35)!important}
#notep,#overviewp{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#notep.show,#overviewp.show{display:flex}
#note-box,#overview-box{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}

<script>
var G={library:[],cur:-1,idx:0,pidx:0,read:{},ttsOn:false,fetching:false};
var PM={on:false,pages:[],pageIdx:0,chIdx:-1};
var SK='nr8',PROXY='https://novel-proxy.runrain.workers.dev/';
var IDB=null;
function idbOpen(cb){if(IDB){cb(IDB);return;}var req=indexedDB.open('nr_content',1);req.onupgradeneeded=function(e){e.target.result.createObjectStore('ch');};req.onsuccess=function(e){IDB=e.target.result;cb(IDB);};req.onerror=function(){cb(null);};}
function idbSet(key,val){if(!key)return;idbOpen(function(db){if(!db)return;try{db.transaction('ch','readwrite').objectStore('ch').put(val,key);}catch(e){}});}
function idbGet(key,cb){if(!key){cb(null);return;}idbOpen(function(db){if(!db){cb(null);return;}try{var req=db.transaction('ch','readonly').objectStore('ch').get(key);req.onsuccess=function(){cb(req.result!=null?req.result:null);};req.onerror=function(){cb(null);};}catch(e){cb(null);}});}
function idbDelChapters(chs){idbOpen(function(db){if(!db)return;try{var tx=db.transaction('ch','readwrite'),st=tx.objectStore('ch');(chs||[]).forEach(function(c){if(c.url)st.delete(c.url);});}catch(e){}});}
var $=function(id){return document.getElementById(id);};
var esc=function(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};

// ── Proxy fetch ──────────────────────────────────────────
function proxyFetch(url,ms,_logCb){
  return new Promise(function(resolve,reject){
    var enc=encodeURIComponent(url);
    var tries=[
      {u:PROXY+'?url='+enc,t:ms||12000,n:'主代理'},
      {u:'https://corsproxy.io/?'+enc,t:10000,n:'corsproxy'},
      {u:'https://api.allorigins.win/raw?url='+enc,t:10000,n:'allorigins'}
    ];
    var ti=0;
    function decode(buf){var b=new Uint8Array(buf),t='';try{t=new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){try{t=new TextDecoder('gbk').decode(b);}catch(e2){t=new TextDecoder('utf-8',{fatal:false}).decode(b);}}return t;}
    function doTry(){
      var cfg=tries[ti];
      if(_logCb&&ti>0)_logCb('⚡ 嘗試備援：'+cfg.n+'…');
      var xhr=new XMLHttpRequest();xhr.open('GET',cfg.u,true);xhr.responseType='arraybuffer';xhr.timeout=cfg.t;
      function next(err){ti++;if(ti<tries.length){doTry();}else{reject(err);}}
      xhr.onload=function(){if(xhr.status>=200&&xhr.status<400){resolve(decode(xhr.response));}else{next(new Error(cfg.n+' HTTP '+xhr.status));}};
      xhr.onerror=function(){next(new Error(cfg.n+' 網路錯誤'));};
      xhr.ontimeout=function(){next(new Error(cfg.n+' 逾時'));};
      xhr.send();
    }
    doTry();
  });
}

// ── Log / progress ───────────────────────────────────────
function flog(msg,cls){var b=$('flog');b.style.display='block';var d=document.createElement('div');d.style.color=cls==='ok'?'var(--ok)':cls==='err'?'var(--err)':cls==='warn'?'var(--warn)':'var(--txd)';d.innerHTML=msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function flogClear(){$('flog').innerHTML='';$('flog').style.display='none';}
function fbar(p){$('fprogw').style.display=p>0&&p<100?'block':'none';$('fprogf').style.width=p+'%';}
function setBadge(s,t){var b=$('fetch-badge');b.className=s;b.textContent=t||'';}

// ── HTML extraction ──────────────────────────────────────
function extractLinks(html,base){var div=document.createElement('div');div.innerHTML=html;var origin='';try{origin=new URL(base).origin;}catch(e){}var links=[],seen={};div.querySelectorAll('a[href]').forEach(function(a){var href=a.getAttribute('href')||'';if(!href||href==='#'||/^javascript/i.test(href))return;var full=href.startsWith('http')?href:origin+(href.startsWith('/')?href:'/'+href);if(seen[full])return;var text=(a.textContent||'').trim().replace(/\s+/g,' ');if(!text||text.length<2||text.length>60)return;if(/^(首頁|登[入錄]|註冊|搜[尋索]|排行|分類|書架|加入|收藏|上[一章]|下[一章]|目錄|返回|關於|聯繫|廣告|反饋|評[論價]|更多|展開|舉報)$/.test(text))return;seen[full]=true;links.push({title:text,url:full});});return links;}
function extractContent(html,chTitle){var div=document.createElement('div');var bm=html.match(/<body[^>]*>([\s\S]*)<\/body>/i);div.innerHTML=bm?bm[1]:html;try{div.querySelectorAll('script,style,nav,header,footer,aside,iframe,noscript,.ad,.ads,[class*="ad-"],[id*="ad-"],[class*="banner"],[class*="recommend"],[class*="comment"],[class*="pagination"],[class*="nav"]').forEach(function(e){e.remove();});}catch(e){}var sels=['#chaptercontent','#chapter_content','#ChapterContent','#content','#Content','#booktext','#BookText','.chapter-content','.chaptercontent','.read-content','.content-text','#readcontent','#article','.article-body','#articleBody','#novel-content','.novel-text','article .content','main .content'];var content='';for(var i=0;i<sels.length;i++){var el=null;try{el=div.querySelector(sels[i]);}catch(e){}if(el){var t=(el.innerText||el.textContent||'').trim();if(t.length>200){content=t;break;}}}if(content.length<200){var best='',bs=0;div.querySelectorAll('div,section,article').forEach(function(el){if(el.children.length>30)return;var t=(el.innerText||el.textContent||'').trim();var sc=t.length-el.querySelectorAll('a').length*15;if(sc>bs&&t.length>200){bs=sc;best=t;}});content=best;}content=content.split('\r\n').join('\n').split('\r').join('\n').replace(/\t/g,' ').replace(/[^\S\n]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();var bad=[/^本章未完/,/^閱讀.*?txt/,/^手機用戶/,/^請記住.*?網址/,/^如果.*?不錯/,/筆趣閣/,/^上一章$/,/^下一章$/,/^章節目錄$/,/^返回$/,/第.{0,5}頁$/,/^\d+\/\d+$/];content=content.split('\n').filter(function(l){var t=l.trim();if(!t)return true;return!bad.some(function(p){return p.test(t);});}).join('\n').replace(/\n{3,}/g,'\n\n').trim();if(chTitle&&chTitle.length>2){var ti=content.indexOf(chTitle);if(ti>0&&ti<content.length*.25)content=content.substring(ti+chTitle.length).trim();}var cm=content.match(/^[\s\S]{0,400}(第[零一二三四五六七八九十百千\d]+[章節回][^\n]{0,60}\n)/);if(cm){var cut=content.indexOf(cm[1])+cm[1].length;if(cut<content.length*.25)content=content.substring(cut).trim();}return content;}
function extractTitle(html){var m=html.match(/<title[^>]*>([^<]+)<\/title>/i);if(!m)return'未命名';return m[1].replace(/[-_|丨–—].*$/,'').replace(/最新章節.*$/,'').replace(/在線.*$/,'').replace(/免費.*$/,'').replace(/小說.*$/,'').trim()||'未命名';}

// ── Auto fetch ───────────────────────────────────────────
$('fetchbtn').addEventListener('click',function(){var url=$('urlin').value.trim();if(!url.startsWith('http')){flogClear();flog('❌ 請輸入完整網址','err');return;}doAutoFetch(url);});
$('urlin').addEventListener('keydown',function(e){if(e.key==='Enter')$('fetchbtn').click();});

async function doAutoFetch(url){
  if(G.fetching)return;G.fetching=true;$('fetchbtn').disabled=true;flogClear();fbar(5);setBadge('loading','抓取中…');flog('<span class="spin"></span> 正在抓取目錄頁…');
  var ih;try{ih=await proxyFetch(url,15000,function(m){flog(m,'warn');});}catch(e){flog('❌ 抓取失敗：'+e.message,'err');setBadge('err','失敗');G.fetching=false;$('fetchbtn').disabled=false;fbar(0);return;}
  var title=extractTitle(ih);flog('✅ 成功（'+Math.round(ih.length/1024)+'KB）','ok');flog('📚 《'+title+'》');fbar(15);
  var chs=extractLinks(ih,url);
  if(chs.length<2){var sc=extractContent(ih,title);if(sc.length>200){var ni=addToLibrary({title:title,url:url,chapters:[{title:title,content:sc}]});openNovel(ni);flog('✅ 完成','ok');fbar(0);setBadge('done','完成');G.fetching=false;$('fetchbtn').disabled=false;return;}flog('❌ 找不到章節連結','err');setBadge('err','無章節');G.fetching=false;$('fetchbtn').disabled=false;fbar(0);return;}
  flog('✅ 找到 '+chs.length+' 章','ok');fbar(20);
  var novel={title:title,url:url,chapters:chs.map(function(c){return{title:c.title,url:c.url,content:null};})};
  var nIdx=addToLibrary(novel);openNovel(nIdx);
  $('chhd').textContent=chs[0].title;$('nt').innerHTML='<p style="color:var(--txd);text-align:center"><span class="spin"></span> 載入第一章…</p>';
  var total=chs.length,done=0,failStreak=0,aborted=false,BATCH=2;
  async function fetchCh(i){
    if(aborted)return;
    var ch=G.library[nIdx].chapters[i];if(!ch||!ch.url){ch.content='';done++;return;}
    try{var h=await proxyFetch(ch.url,12000,null);ch.content=extractContent(h,ch.title);if(!ch.content)ch.content='（無法擷取）';else{idbSet(ch.url,ch.content);failStreak=0;}}
    catch(e){ch.content='（失敗：'+e.message+'）';failStreak++;if(failStreak>=5){aborted=true;flog('⛔ 連續 '+failStreak+' 次連線失敗，已中止抓取。書籍已加入書架，可手動刪除。','err');setBadge('err','中止');fbar(0);save();return;}}
    done++;fbar(20+Math.round(done/total*75));setBadge('loading',done+'/'+total);updateTOCItem(i);if(i===G.idx&&G.cur===nIdx)showChapter(i);
    if(!aborted&&done===total){flog('🎉 全部'+total+'章完成！','ok');setBadge('done','全'+total+'章 ✓');fbar(0);save();}
  }
  for(var i=0;i<total&&!aborted;i+=BATCH){var batch=[];for(var j=i;j<Math.min(i+BATCH,total);j++)batch.push(fetchCh(j));await Promise.all(batch);if(aborted)break;if(i+BATCH<total)await new Promise(function(r){setTimeout(r,250);});}
  G.fetching=false;$('fetchbtn').disabled=false;
}

// ── Library ──────────────────────────────────────────────
function addToLibrary(novel){
  if(!novel.status)novel.status='reading';
  var ex=-1;if(novel.url)for(var i=0;i<G.library.length;i++){if(G.library[i].url===novel.url){ex=i;break;}}
  if(ex>=0){G.library[ex]=novel;updateExpSel();return ex;}
  G.library.push(novel);updateExpSel();return G.library.length-1;
}

function buildShelf(filter){
  filter=filter||'all';

  var items=G.library.map(function(n,i){return{n:n,i:i};}).sort(function(a,b){
    if(a.i===G.cur&&b.i!==G.cur)return -1;
    if(b.i===G.cur&&a.i!==G.cur)return 1;
    return(ord[novelStatus(a.n)]||0)-(ord[novelStatus(b.n)]||0);
  });
  items.forEach(function(item){
    var n=item.n,i=item.i,st=novelStatus(n);
    if(filter!=='all'&&st!==filter)return;
    var rc=(G.read[i]||[]).length,total=n.chapters?n.chapters.length:0;

    var ps=n.pubStatus||'';
    var psLabel={ongoing:'連載中',completed:'已完本',dropped:'已棄更','':'未標'}[ps];
    var psClass={ongoing:'pub-ongoing',completed:'pub-completed',dropped:'pub-dropped','':'pub-none'}[ps];
    card.innerHTML=

      '<div class="sc-body">'+

        (n.author?'<div class="sc-author">'+esc(n.author)+'</div>':'')+
        '<div class="sc-bar-wrap"><div class="sc-bar" style="width:'+pct+'%"></div></div>'+
        '<div class="sc-foot">'+
          '<span class="sc-stat '+st+'">'+STATUS_LABEL[st]+'</span>'+
          '<span class="sc-prog">'+rc+'/'+total+'章</span>'+
        '</div>'+
        '<div class="sc-status-row">'+
          '<button class="ssb'+(st==='want'?' sw':'')+'" data-s="want" data-ni="'+i+'">想讀</button>'+
          '<button class="ssb'+(st==='reading'?' sr':'')+'" data-s="reading" data-ni="'+i+'">在讀</button>'+
          '<button class="ssb'+(st==='done'?' sd':'')+'" data-s="done" data-ni="'+i+'">完成</button>'+
        '</div>'+

    });

    var f=t.dataset.filter;
    if(f==='all')t.textContent='全部('+G.library.length+')';

function curFilter(){var a=document.querySelector('.stab.active');return a?a.dataset.filter:'all';}

function deleteNovel(ni){
  if(!confirm('確定刪除《'+G.library[ni].title+'》？'))return;
  idbDelChapters(G.library[ni].chapters);
  G.library.splice(ni,1);
  var nr={};Object.keys(G.read).forEach(function(k){var ki=+k;if(ki<ni)nr[ki]=G.read[k];else if(ki>ni)nr[ki-1]=G.read[k];});
  G.read=nr;
  if(G.cur===ni)G.cur=-1;else if(G.cur>ni)G.cur--;
  updateExpSel();save();buildShelf(curFilter());
  if(!G.library.length)showAddView();
}

function openNovel(ni){
  // Switch novel if needed
  if(G.cur!==ni){
    G.cur=ni;
    if(!G.read[ni])G.read[ni]=[];
    if(!G.library[ni].startDate)G.library[ni].startDate=new Date().toISOString().slice(0,10);
    var n=G.library[ni];
    $('ns').textContent=n.title.length>14?n.title.substring(0,14)+'…':n.title;
    buildTOC();
  }
  $('tcl').style.display='';$('sbf').style.display='';$('tcq').style.display='';
  // Jump to last read chapter
  var ch=G.idx||0;
  if(G.cur===ni&&G.idx>0)ch=G.idx;
  showChapter(ch);
  $('wc').style.display='none';
  updateExpSel();save();
}

// ── TOC ──────────────────────────────────────────────────
function buildTOC(q){
  if(G.cur<0||!G.library[G.cur])return;
  var list=$('tcl');list.innerHTML='';
  var ql=(q||'').toLowerCase(),n=G.library[G.cur],rs=G.read[G.cur]||[];
  n.chapters.forEach(function(ch,i){
    if(ql&&ch.title.toLowerCase().indexOf(ql)<0)return;
    var isLoad=ch.content===null,isRead=rs.indexOf(i)>=0,isAct=i===G.idx;
    var d=document.createElement('div');
    d.className='ti'+(isAct?' active':isRead?' read':isLoad?' loading':'');
    d.setAttribute('data-i',i);
    var ck=isRead?'<span class="ti-check"> ✓</span>':'';
    var ld=isLoad?'<span style="color:var(--warn)"> ⋯</span>':'';
    d.innerHTML='<div class="ti-body"><div class="ti-meta">第'+(i+1)+'章'+ld+ck+'</div><div class="ti-title">'+esc(ch.title)+'</div></div><span class="ti-edit" data-ei="'+i+'">✏️</span><span class="ti-del" data-di="'+i+'">🗑</span>';
    d.addEventListener('click',function(e){if(e.target.closest('.ti-del')||e.target.closest('.ti-edit'))return;showChapter(+this.getAttribute('data-i'));if(window.innerWidth<=680)closeSB();});
    list.appendChild(d);
  });
  list.querySelectorAll('.ti-del').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var i=+this.getAttribute('data-di');if(!confirm('刪除「'+G.library[G.cur].chapters[i].title+'」？'))return;G.library[G.cur].chapters.splice(i,1);if(G.idx>=G.library[G.cur].chapters.length)G.idx=Math.max(0,G.library[G.cur].chapters.length-1);buildTOC(q);showChapter(G.idx);save();});});
  list.querySelectorAll('.ti-edit').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var i=+this.getAttribute('data-ei');var row=this.closest('.ti');var titleEl=row.querySelector('.ti-title');var orig=G.library[G.cur].chapters[i].title;var inp=document.createElement('input');inp.value=orig;inp.style.cssText='width:100%;padding:2px 5px;background:var(--pn);border:1px solid var(--ac);border-radius:4px;color:var(--tx);font-size:14px;outline:none;';titleEl.replaceWith(inp);inp.focus();inp.select();var done=false;function confirm(){if(done)return;done=true;var v=inp.value.trim()||orig;G.library[G.cur].chapters[i].title=v;save();buildTOC(q);}inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();confirm();}else if(e.key==='Escape'){done=true;buildTOC(q);}});inp.addEventListener('blur',confirm);});});
  $('sbf').textContent='已讀 '+(G.read[G.cur]||[]).length+' / '+n.chapters.length+' 章';
}
$('tcq').addEventListener('input',function(){buildTOC(this.value);});

// ── Show chapter ─────────────────────────────────────────
function showChapter(i,startPage){
  if(G.cur<0||!G.library[G.cur])return;
  var chs=G.library[G.cur].chapters;if(i<0||i>=chs.length)return;
  var _sp=startPage||0;
  G.idx=i;if(!G.read[G.cur])G.read[G.cur]=[];if(G.read[G.cur].indexOf(i)<0)G.read[G.cur].push(i);
  var ch=chs[i];$('chhd').textContent=ch.title;$('chtl').textContent=ch.title;
  if(ch.content===null){
    $('nt').innerHTML='<p style="color:var(--txd);text-align:center"><span class="spin"></span> 載入中…</p>';
    var _bk=G.cur,_ci=i;
    idbGet(ch.url,function(cached){
      if(G.cur!==_bk||G.idx!==_ci)return;
      if(cached!==null){ch.content=cached;var ps=cached.split('\n').filter(function(l){return l.trim();});$('nt').innerHTML=ps.length?ps.map(function(p){return'<p>'+markQuotes(p,_ci)+'</p>';}).join(''):'<p style="color:var(--txd);text-align:center">（本章無內文）</p>';if(PM.on)paginateChapter(_ci,_sp);}
      else if(ch.url){proxyFetch(ch.url,12000).then(function(h){if(G.cur!==_bk||G.idx!==_ci)return;var c=extractContent(h,ch.title);if(!c)c='（無法擷取）';ch.content=c;if(c!=='（無法擷取）')idbSet(ch.url,c);var ps=c.split('\n').filter(function(l){return l.trim();});$('nt').innerHTML=ps.length?ps.map(function(p){return'<p>'+markQuotes(p,_ci)+'</p>';}).join(''):'<p style="color:var(--txd);text-align:center">（本章無內文）</p>';updateTOCItem(_ci);if(PM.on)paginateChapter(_ci,_sp);}).catch(function(e){if(G.cur!==_bk||G.idx!==_ci)return;$('nt').innerHTML='<p style="color:var(--err)">載入失敗：'+esc(e.message)+'</p>';});}
    });
  }
  else{var ps=(ch.content||'').split('\n').filter(function(l){return l.trim();});$('nt').innerHTML=ps.length?ps.map(function(p){return'<p>'+markQuotes(p,_ci)+'</p>';}).join(''):'<p style="color:var(--txd);text-align:center">（本章無內文）</p>';}
  $('rw').scrollTop=0;$('pvbtn').disabled=(i===0);$('nxbtn').disabled=(i===chs.length-1);
  var pct=chs.length>1?Math.round(i/(chs.length-1)*100):100;$('pg').style.width=pct+'%';$('pind').textContent='第'+(i+1)+' / '+chs.length+'章';
  document.querySelectorAll('.ti').forEach(function(el){var n=+el.getAttribute('data-i'),rs=G.read[G.cur]||[];el.className='ti'+(n===i?' active':rs.indexOf(n)>=0?' read':'');if(n===i)el.scrollIntoView({block:'nearest'});});
  $('sbf').textContent='已讀 '+(G.read[G.cur]||[]).length+' / '+chs.length+'章';
  if(PM.on){$('rc').style.display='none';$('pw').style.display='flex';$('bb').style.display='none';paginateChapter(i,_sp);}
  else{$('rc').style.display='block';$('pw').style.display='none';$('bb').style.display='';}
  if(G.ttsOn)stopTTS();save();$('rw').focus();
}

// ── Page mode ────────────────────────────────────────────
$('bpm').addEventListener('click',togglePM);
function applyPMState(){$('bpm').classList.toggle('on',PM.on);$('bpm').textContent=PM.on?'📜 捲動':'📄 分頁';if(G.cur>=0&&G.library[G.cur]){$('rc').style.display=PM.on?'none':'block';$('pw').style.display=PM.on?'flex':'none';$('bb').style.display=PM.on?'none':'';}}
function togglePM(){PM.on=!PM.on;applyPMState();localStorage.setItem('nr_pmstate',PM.on?'1':'0');if(PM.on&&G.cur>=0)paginateChapter(G.idx,0);}
function paginateChapter(chIdx,startPage){
  if(G.cur<0||!G.library[G.cur])return;var ch=G.library[G.cur].chapters[chIdx];PM.chIdx=chIdx;
  if(!ch||ch.content===null){renderPg(chIdx,[],0,1,ch?ch.title:'載入中…');return;}
  var paras=(ch.content||'').split('\n').filter(function(l){return l.trim();});
  if(!paras.length){PM.pages=[[]];renderPg(chIdx,[],0,1,ch.title);return;}
  var pw=$('pw'),fs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||18;
  var lh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||1.95;
  var tp=window.innerWidth>=768;
  $('pw').classList.toggle('twopage',tp);

function handleKey(key,code,pd){
  var tag=document.activeElement?document.activeElement.tagName:'';
  if(['INPUT','TEXTAREA','SELECT'].includes(tag)&&document.activeElement.id!=='kb-trap')return;
  var handled=true;
  if(PM.on){
    if(key==='ArrowLeft'||key==='ArrowUp'||key==='PageUp'||code===37||code===38||code===33)pagePrev();
    else if(key==='ArrowRight'||key==='ArrowDown'||key===' '||key==='PageDown'||code===39||code===40||code===32||code===34)pageNext();
    else if(key==='AudioVolumeDown'||code===174)pagePrev();
    else if(key==='AudioVolumeUp'||code===175)pageNext();
    else if(key==='MediaTrackPrevious'||code===177)pagePrev();
    else if(key==='MediaTrackNext'||code===176)pageNext();
    else if(key==='t'||key==='T')togSB();
    else handled=false;
  }else{
    if(key==='ArrowLeft'||code===37){showChapter(G.idx-1);hint('← 上一章');}
    else if(key==='ArrowRight'||code===39){showChapter(G.idx+1);hint('→ 下一章');}
    else if(key==='ArrowUp'||code===38)$('rw').scrollBy({top:-70,behavior:'smooth'});
    else if(key==='ArrowDown'||code===40)$('rw').scrollBy({top:70,behavior:'smooth'});
    else if(key===' '||key==='PageDown'||code===32||code===34)$('rw').scrollBy({top:$('rw').clientHeight*.8,behavior:'smooth'});
    else if(key==='PageUp'||code===33)$('rw').scrollBy({top:-$('rw').clientHeight*.8,behavior:'smooth'});
    else if(key==='Home'||code===36)showChapter(0);
    else if(key==='End'||code===35){if(G.library[G.cur])showChapter(G.library[G.cur].chapters.length-1);}
    else if(key==='t'||key==='T')togSB();
    else if(key==='s'||key==='S')togTTS();
    else if(key==='AudioVolumeDown'||code===174)showChapter(G.idx-1);
    else if(key==='AudioVolumeUp'||code===175)showChapter(G.idx+1);
    else if(key==='MediaTrackPrevious'||code===177)showChapter(G.idx-1);
    else if(key==='MediaTrackNext'||code===176)showChapter(G.idx+1);
    else handled=false;
  }
  if(handled&&pd)pd();
}

function markQuotes(text,chIdx){
  if(G.cur<0)return esc(text);
  var notes=((G.library[G.cur]||{}).notes||[]).filter(function(n){return n.chIdx===chIdx&&n.quote;});
  if(!notes.length)return esc(text);
  var ranges=[];
  notes.forEach(function(note){var q=note.quote,idx=text.indexOf(q);while(idx>=0){ranges.push([idx,idx+q.length,note.color]);idx=text.indexOf(q,idx+1);}});
  if(!ranges.length)return esc(text);
  ranges.sort(function(a,b){return a[0]-b[0];});
  var merged=[];
  ranges.forEach(function(r){if(merged.length&&r[0]<merged[merged.length-1][1])merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],r[1]);else merged.push([r[0],r[1],r[2]]);});
  var out='',pos=0;
  merged.forEach(function(r){if(pos<r[0])out+=esc(text.slice(pos,r[0]));out+='<span style="text-decoration:underline;text-decoration-color:'+r[2]+';text-decoration-thickness:2px">'+esc(text.slice(r[0],r[1]))+'</span>';pos=r[1];});
  if(pos<text.length)out+=esc(text.slice(pos));
  return out;
}

      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      _editCoverUrl=cv.toDataURL('image/jpeg',0.85);
      $('cover-preview').innerHTML='<img src="'+_editCoverUrl+'" style="width:100%;height:100%;object-fit:cover;display:block">';
    };img.src=ev.target.result;
  };fr.readAsDataURL(file);this.value='';
});
$('cover-clear-btn').addEventListener('click',function(){_editCoverUrl='__clear__';$('cover-preview').innerHTML=svgClosedBook('#8b6914');});

// ── Notes ────────────────────────────────────────────────
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ensureNotes(ni){if(ni==null)ni=G.cur;if(!G.library[ni])return;if(!G.library[ni].notes)G.library[ni].notes=[];if(G.library[ni].review==null)G.library[ni].review='';}
var NP_COLOR='#fff3a3',NP_QUOTE='',NP_DISMISSED='',mouseDownInReader=false,_pendingNoteQuote='';
function onReaderMD(){mouseDownInReader=true;if(document.activeElement===kbTrap)kbTrap.blur();}
$('pbook').addEventListener('mousedown',onReaderMD);
$('rc').addEventListener('mousedown',onReaderMD);
document.addEventListener('mouseup',function(){mouseDownInReader=false;});
function onSel(){
  var pn=$('note-popup');
  if($('notep').classList.contains('show')||$('overviewp').classList.contains('show')||$('editp').classList.contains('show'))return;
  var el=document.activeElement;if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.id!=='kb-trap')return;
  var sel=window.getSelection(),q=(sel&&sel.toString()||'').trim();
  if(!q||q.length<2||G.cur<0){return;}
  if(q===NP_DISMISSED){NP_DISMISSED='';return;}
  NP_DISMISSED='';
  NP_QUOTE=q;
  var rect=sel.getRangeAt(0).getBoundingClientRect();
  $('np-quote').textContent='”'+q.substring(0,100)+(q.length>100?'…':'')+'”';
  $('np-text').value='';
  pn.style.display='block';
  var vw=window.innerWidth,vh=window.innerHeight,pw2=275;
  var x=Math.max(5,Math.min(rect.left+(rect.width/2)-(pw2/2),vw-pw2-5));
  var y=rect.bottom+8;if(y+230>vh)y=Math.max(5,rect.top-235);
  pn.style.left=x+'px';pn.style.top=y+'px';
}
document.addEventListener('mouseup',onSel);
document.addEventListener('touchend',function(){setTimeout(onSel,80);});
document.addEventListener('mousedown',function(e){if($('note-popup').style.display!=='none'&&!$('note-popup').contains(e.target)){hideNP();}});
document.addEventListener('touchstart',function(e){if($('note-popup').style.display!=='none'&&!$('note-popup').contains(e.target)){hideNP();}},{passive:true});
function hideNP(){NP_DISMISSED=NP_QUOTE;$('note-popup').style.display='none';NP_QUOTE='';}
document.querySelectorAll('.nc').forEach(function(b){
  b.addEventListener('click',function(e){e.stopPropagation();document.querySelectorAll('.nc').forEach(function(x){x.classList.remove('on');});this.classList.add('on');NP_COLOR=this.dataset.c;});
});
$('np-cancel').addEventListener('click',function(){if(window.getSelection)window.getSelection().removeAllRanges();hideNP();});
$('np-save').addEventListener('click',function(){
  if(!NP_QUOTE||G.cur<0)return;ensureNotes();
  var ch=G.library[G.cur].chapters[G.idx]||{};
  G.library[G.cur].notes.push({id:Date.now(),chIdx:G.idx,chTitle:ch.title||'',quote:NP_QUOTE,text:$('np-text').value.trim(),color:NP_COLOR,ts:Date.now(),pageIdx:PM.on?PM.pageIdx:0});
  save();hideNP();window.getSelection().removeAllRanges();updateUnderlines();
});
$('bnotes').addEventListener('click',showBookNotes);
function showBookNotes(){
  if(G.cur<0){alert('請先開啟一本小說');return;}
  ensureNotes();
  $('note-box-title').textContent='📝 '+G.library[G.cur].title+' 的筆記';
  buildNoteList($('note-list'),G.library[G.cur].notes,G.cur,false);
  $('notep').classList.add('show');
}
function buildNoteList(el,notes,bi,inOverview){
  el.innerHTML='';
  if(!notes||!notes.length){el.innerHTML='<p style=”color:var(--txd);text-align:center;padding:20px 0;font-size:14px”>尚無筆記</p>';return;}
  notes.slice().reverse().forEach(function(note,rni){
    var ni=notes.length-1-rni;
    var d=document.createElement('div');d.className='ncard';
    var bkName=inOverview&&G.library[bi]?'<div style=”font-size:10px;color:var(--ac);font-weight:700;margin-bottom:3px”>📚 '+esc(G.library[bi].title)+'</div>':'';
    d.innerHTML='<div style=”display:flex;gap:8px;align-items:flex-start”><div style=”width:10px;min-width:10px;height:10px;border-radius:50%;background:'+note.color+';border:1px solid rgba(0,0,0,.18);margin-top:4px”></div><div style=”flex:1;min-width:0”>'+bkName+'<div style=”font-size:11px;color:var(--txd);margin-bottom:4px”>'+esc(note.chTitle||'')+(note.pageIdx?'  p.'+(note.pageIdx+1):'')+'</div><div style=”font-size:13px;color:var(--txd);font-style:italic;border-left:3px solid '+note.color+';padding-left:8px;margin-bottom:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical”>”'+esc(note.quote)+'”</div>'+(note.text?'<div style=”font-size:13px;color:var(--tx);line-height:1.55”>'+esc(note.text)+'</div>':'')+'</div></div>';
    var dbtn=document.createElement('button');dbtn.textContent='×';dbtn.style.cssText='background:none;border:none;color:var(--txr);cursor:pointer;font-size:18px;flex-shrink:0;padding:0 3px;line-height:1';d.firstChild.appendChild(dbtn);
    d.addEventListener('click',function(e){
      if(e.target===dbtn)return;
      $('notep').classList.remove('show');$('overviewp').classList.remove('show');
      var chIdx=note.chIdx;
      openNovel(bi);
      _pendingNoteQuote=note.quote||'';
      showChapter(chIdx,0);
    });
    (function(capBi,capNi,capOv){
      dbtn.addEventListener('click',function(e){
        e.stopPropagation();
        if(!confirm('刪除此筆記？'))return;
        G.library[capBi].notes.splice(capNi,1);save();updateUnderlines();
        if(capOv){showOverview();}else{showBookNotes();}
      });
    })(bi,ni,inOverview);
    el.appendChild(d);
  });
}
$('bnotesov').addEventListener('click',showOverview);
function showOverview(){
  var box=$('overview-list');box.innerHTML='';var any=false;
  G.library.forEach(function(n,bi){
    ensureNotes(bi);if(!n.notes.length)return;any=true;
    var sec=document.createElement('div');sec.style.marginBottom='18px';
    sec.innerHTML='<div style="font-size:13px;font-weight:700;color:var(--ac);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd)">📚 '+esc(n.title)+'<span style="font-weight:400;color:var(--txd);font-size:12px;margin-left:6px">('+n.notes.length+'則)</span></div>';
    buildNoteList(sec,n.notes,bi,true);
    box.appendChild(sec);
  });
  if(!any)box.innerHTML='<p style="color:var(--txd);text-align:center;padding:24px 0;font-size:14px">尚無任何筆記</p>';
  $('overviewp').classList.add('show');
}

// ── TTS ──────────────────────────────────────────────────
$('btts').addEventListener('click',function(){$('ttp').classList.toggle('show');$('setp').classList.remove('show');$('expp').classList.remove('show');});$('tplaybtn').addEventListener('click',togTTS);
function fillVoices(){$('tvsel').innerHTML='';var vs=speechSynthesis.getVoices(),zh=vs.filter(function(v){return v.lang.indexOf('zh')===0;});(zh.length?zh:vs.slice(0,15)).forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';$('tvsel').appendChild(o);});}
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=fillVoices;setTimeout(fillVoices,500);
$('trate').addEventListener('input',function(){$('rv').textContent=parseFloat(this.value).toFixed(1);});$('tpitch').addEventListener('input',function(){$('pv').textContent=parseFloat(this.value).toFixed(1);});$('tvol').addEventListener('input',function(){$('vv').textContent=parseFloat(this.value).toFixed(1);});
function togTTS(){G.ttsOn?stopTTS():startTTS();}
function startTTS(){if(G.cur<0)return;speechSynthesis.cancel();var ch=G.library[G.cur].chapters[G.idx];var text=(ch.content||ch.title||'').replace(/\n/g,'。');if(!text)return;var u=new SpeechSynthesisUtterance(text);var v=speechSynthesis.getVoices().find(function(x){return x.name===$('tvsel').value;});if(v)u.voice=v;u.rate=parseFloat($('trate').value);u.pitch=parseFloat($('tpitch').value);u.volume=parseFloat($('tvol').value);u.onend=function(){G.ttsOn=false;$('tplaybtn').textContent='▶ 開始朗讀';$('btts').classList.remove('on');};speechSynthesis.speak(u);G.ttsOn=true;$('tplaybtn').textContent='⏹ 停止朗讀';$('btts').classList.add('on');}
function stopTTS(){speechSynthesis.cancel();G.ttsOn=false;$('tplaybtn').textContent='▶ 開始朗讀';$('btts').classList.remove('on');}

// ── Settings ─────────────────────────────────────────────
$('bset').addEventListener('click',function(){$('setp').classList.toggle('show');$('ttp').classList.remove('show');$('expp').classList.remove('show');});
$('fsr').addEventListener('input',function(){$('fsv').textContent=this.value;document.documentElement.style.setProperty('--fs',this.value+'px');if(PM.on)paginateChapter(PM.chIdx,PM.pageIdx);localStorage.setItem('nr_fs',this.value);});
$('lhr').addEventListener('input',function(){$('lhv').textContent=parseFloat(this.value).toFixed(1);document.documentElement.style.setProperty('--lh',this.value);if(PM.on)paginateChapter(PM.chIdx,PM.pageIdx);localStorage.setItem('nr_lh',this.value);});
$('pmr').addEventListener('input',function(){$('pmv').textContent=this.value;document.documentElement.style.setProperty('--pm',this.value+'px');localStorage.setItem('nr_pmw',this.value);});
document.querySelectorAll('.thb').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.thb').forEach(function(x){x.classList.remove('on');});this.classList.add('on');document.body.className=this.dataset.th;localStorage.setItem('nr_th',this.dataset.th);document.querySelectorAll('.cbtn').forEach(function(c){c.classList.remove('on');});localStorage.removeItem('nr_bg');});});
document.querySelectorAll('.cbtn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('on');});this.classList.add('on');var bg=this.dataset.bg;if(bg){document.documentElement.style.setProperty('--bg',bg);localStorage.setItem('nr_bg',bg);}else{document.documentElement.style.removeProperty('--bg');localStorage.removeItem('nr_bg');}});});
$('custom-bg').addEventListener('input',function(){document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('on');});document.documentElement.style.setProperty('--bg',this.value);localStorage.setItem('nr_bg',this.value);});

// ── Export / Import ──────────────────────────────────────
$('bexp').addEventListener('click',function(){$('expp').classList.toggle('show');$('ttp').classList.remove('show');$('setp').classList.remove('show');});
function updateExpSel(){var s=$('exp-sel');s.innerHTML='<option value="all">全部小說 ('+G.library.length+'本)</option>';G.library.forEach(function(n,i){var o=document.createElement('option');o.value=i;o.textContent=n.title;s.appendChild(o);});}
window.doExport=function(){
  var sel=$('exp-sel').value,data,fname;
  if(sel==='all'){data={v:3,library:G.library,read:G.read,cur:G.cur,idx:G.idx,at:new Date().toISOString()};fname='novels_all_'+new Date().toISOString().substring(0,10)+'.json';}
  else{var i=+sel;data={v:3,library:[G.library[i]],read:{'0':G.read[i]||[]},cur:0,idx:G.cur===i?G.idx:0,at:new Date().toISOString()};fname=(G.library[i].title||'novel').replace(/[\/\\:*?"<>|]/g,'_')+'.json';}
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();$('exp-stat').textContent='✅ 已匯出（含閱讀進度）'+fname;
};
$('imp-file').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(ev){try{
    var d=JSON.parse(ev.target.result),novels=d.library||[];if(!novels.length)throw new Error('無資料');
    var added=0,base=G.library.length;
    novels.forEach(function(n,i){if(n&&n.title&&n.chapters){G.library.push(n);if(d.read&&d.read[i])G.read[base+added]=d.read[i];added++;}});
    updateExpSel();save();$('exp-stat').textContent='✅ 匯入 '+added+' 本';
    if(added>0){var tn=base+(d.cur||0);if(tn<G.library.length){openNovel(tn);if(d.idx&&d.idx>0)showChapter(d.idx);}}
  }catch(e2){$('exp-stat').textContent='❌ '+e2.message;}};
  r.readAsText(file);this.value='';
});
$('bexp-shelf').addEventListener('click',function(){$('expp').classList.toggle('show');$('ttp').classList.remove('show');$('setp').classList.remove('show');});
document.addEventListener('click',function(e){[['ttp','btts'],['setp','bset'],['expp','bexp','bexp-shelf']].forEach(function(p){if(!$(p[0]).contains(e.target)&&p.slice(1).every(function(id){return!$(id).contains(e.target);}))$(p[0]).classList.remove('show');});});

// ── Persist ──────────────────────────────────────────────
function save(){
  try{
    G.library.forEach(function(n,i){if(!n.bid)n.bid='bk'+Date.now()+i+Math.random().toString(36).slice(2,5);});
var d={library:G.library.map(function(n){return{title:n.title,author:n.author||'',intro:n.intro||'',url:n.url||'',status:n.status||'reading',pubStatus:n.pubStatus||'',bid:n.bid||'',startDate:n.startDate||'',finishDate:n.finishDate||'',review:n.review||'',notes:n.notes||[],chapters:n.chapters.map(function(c){return{title:c.title,url:c.url||'',content:c.url?null:c.content};})};  }),cur:G.cur,idx:G.idx,pidx:PM.pageIdx,read:G.read};
    localStorage.setItem(SK,JSON.stringify(d));
  }catch(e){try{
    var bare={library:G.library.map(function(n){return{title:n.title,author:n.author||'',intro:n.intro||'',url:n.url||'',status:n.status||'reading',chapters:n.chapters.map(function(c){return{title:c.title,url:c.url||'',content:null};})};  }),cur:G.cur,idx:G.idx,read:G.read};
    localStorage.setItem(SK,JSON.stringify(bare));
  }catch(e2){console.error('save error:',e2);}}
}
function restore(){
  var th=localStorage.getItem('nr_th')||'';document.body.className=th;document.querySelectorAll('.thb').forEach(function(b){b.classList.toggle('on',b.dataset.th===th);});
  var fs=localStorage.getItem('nr_fs');if(fs){$('fsr').value=fs;$('fsv').textContent=fs;document.documentElement.style.setProperty('--fs',fs+'px');}
  var lh=localStorage.getItem('nr_lh');if(lh){$('lhr').value=lh;$('lhv').textContent=parseFloat(lh).toFixed(1);document.documentElement.style.setProperty('--lh',lh);}
  var pmw=localStorage.getItem('nr_pmw');if(pmw){$('pmr').value=pmw;$('pmv').textContent=pmw;document.documentElement.style.setProperty('--pm',pmw+'px');}
  var bg=localStorage.getItem('nr_bg');if(bg){document.documentElement.style.setProperty('--bg',bg);$('custom-bg').value=bg;}
  try{var raw=localStorage.getItem(SK);if(!raw)return;var x=JSON.parse(raw);
    if(x.library&&x.library.length){G.library=x.library;G.read=x.read||{};G.cur=x.cur!=null?x.cur:-1;G.idx=x.idx||0;G.pidx=x.pidx||0;updateExpSel();
      G.library.forEach(function(n){n.chapters.forEach(function(c){if(c.content&&c.url)idbSet(c.url,c.content);});});}
  }catch(e){console.error('restore error:',e);}
  var pmPref=localStorage.getItem('nr_pmstate');if(pmPref===null)pmPref='1';PM.on=(pmPref==='1');
}

// ── Init ─────────────────────────────────────────────────
restore();
try{
  if(G.cur>=0&&G.library[G.cur]){
    var n=G.library[G.cur];
    $('ns').textContent=n.title.length>14?n.title.substring(0,14)+'…':n.title;
    buildTOC();
    $('tcl').style.display='';$('sbf').style.display='';$('tcq').style.display='';
    showChapter(G.idx,G.pidx||0);
    $('wc').style.display='none';
    applyPMState();
    if(PM.on)setTimeout(function(){paginateChapter(G.idx,G.pidx||0);},150);
  }else{
    showShelf();
  }
}catch(e){console.error('init error:',e);showShelf();}
setTimeout(refocusTrap,300);
</script>
