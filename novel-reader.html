<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>📖 小說閱讀器</title>
<style>
:root{
  --bg:#18140f;--sf:#221d17;--pn:#2a2318;--bd:#3a3028;
  --ac:#c9a96e;--ac2:#e8c98a;--tx:#ede3d5;--txd:#9a8f82;--txr:#504540;
  --err:#d07070;--ok:#70c080;--warn:#c9b070;
  --serif:'Georgia','Songti SC','Noto Serif TC',serif;
  --ui:-apple-system,'Segoe UI',system-ui,sans-serif;
  --sw:290px;--pm:720px;--fs:19px;--lh:2.1;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-text-size-adjust:100%}
#app{display:flex;height:100%;height:100dvh}

/* ── Sidebar ── */
#sb{width:var(--sw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .26s ease;z-index:20;position:relative}
#sb.col{transform:translateX(-100%);position:absolute;height:100%}
#sbh{padding:16px 14px 11px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px}
#sbh span{font-size:20px}
#sbh h1{font-size:13px;font-weight:600;color:var(--ac);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#tcq{margin:8px 10px;padding:7px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:14px;outline:none;width:calc(100% - 20px);-webkit-appearance:none}
#tcq:focus{border-color:var(--ac)}
#tcl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:3px 0}
.ti{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--txd);border-left:3px solid transparent;line-height:1.45;transition:all .12s;user-select:none}
.ti:active{background:var(--pn)}
.ti.active{border-left-color:var(--ac);color:var(--ac2);background:var(--pn)}
.ti.read{color:var(--txr)}
.tin{font-size:10px;color:var(--txr);margin-bottom:2px}
#sbf{padding:10px 14px;border-top:1px solid var(--bd);font-size:11px;color:var(--txr);text-align:center;padding-bottom:calc(10px + var(--safe-b))}

/* ── Main ── */
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Topbar ── */
#topbar{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:5px;padding:0 12px;flex-shrink:0}
.btn{background:none;border:1px solid var(--bd);color:var(--txd);padding:5px 9px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:3px;transition:all .12s;white-space:nowrap;-webkit-appearance:none;user-select:none}
.btn:active,.btn:hover{color:var(--tx);border-color:var(--ac)}
.btn.on{color:var(--ac);border-color:var(--ac);background:rgba(201,169,110,.1)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 2px;flex-shrink:0}
#chtl{flex:1;font-size:13px;color:var(--txd);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ── Reader wrap ── */
#rw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none;position:relative}
#rw::-webkit-scrollbar{display:none}

/* ── Welcome screen ── */
#wc{max-width:580px;margin:0 auto;padding:28px 20px;padding-bottom:calc(28px + var(--safe-b))}
.wlogo{font-size:52px;text-align:center;margin-bottom:10px}
.wtitle{font-size:22px;color:var(--ac2);font-family:var(--serif);text-align:center;margin-bottom:6px;letter-spacing:.5px}
.wsub{font-size:13px;color:var(--txd);text-align:center;margin-bottom:22px;line-height:1.6}

/* ── Steps card ── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--ac);margin-bottom:14px;font-weight:600}
.step{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start}
.step:last-child{margin-bottom:0}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:13px;color:var(--txd);line-height:1.6;flex:1}
.step-text strong{color:var(--tx);display:block;margin-bottom:2px}
.step-text code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;font-size:12px;color:var(--ac2)}

/* ── Paste area ── */
#pa{width:100%;height:150px;background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px;font-size:13px;resize:none;outline:none;font-family:var(--ui);display:block;-webkit-appearance:none;margin-bottom:9px}
#pa:focus{border-color:var(--ac)}
#ptitle{width:100%;padding:9px 11px;background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;font-size:13px;outline:none;-webkit-appearance:none;margin-bottom:9px}
#ptitle:focus{border-color:var(--ac)}
.gbtn{width:100%;padding:12px;background:var(--ac);color:var(--bg);border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;-webkit-appearance:none;user-select:none;transition:opacity .15s}
.gbtn:active{opacity:.8}
#pstat{font-size:13px;color:var(--txd);min-height:20px;margin-top:8px;line-height:1.5}
#pstat.err{color:var(--err)}
#pstat.ok{color:var(--ok)}
#pbar-w{width:100%;height:4px;background:var(--bd);border-radius:2px;margin-top:8px;display:none}
#pbar-w.show{display:block}
#pbar-f{height:100%;background:var(--ac);border-radius:2px;transition:width .3s;width:0%}

/* ── Bookmarklet section ── */
.bkl-wrap{text-align:center;padding:4px 0}
#bkl{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:linear-gradient(135deg,var(--ac),#b8882a);color:var(--bg);border-radius:9px;font-size:14px;font-weight:700;text-decoration:none;user-select:none}
.bkl-note{font-size:11.5px;color:var(--txr);margin-top:6px;line-height:1.5}

/* ── Reading content ── */
#rc{display:none;max-width:var(--pm);margin:0 auto;padding:44px 28px 120px}
#chhd{font-size:21px;font-family:var(--serif);color:var(--ac2);margin-bottom:28px;line-height:1.5;text-align:center;border-bottom:1px solid var(--bd);padding-bottom:18px}
#nt{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx)}
#nt p{margin-bottom:1.15em;text-indent:2em}

/* ── Bottom bar ── */
#bb{height:calc(52px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-bottom:var(--safe-b);flex-shrink:0}
.nb{background:var(--pn);border:1px solid var(--bd);color:var(--txd);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s;user-select:none;-webkit-appearance:none}
.nb:active{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.nb:disabled{opacity:.25;pointer-events:none}
#pind{font-size:12px;color:var(--txd);text-align:center}
#pgw{width:90px;height:3px;background:var(--bd);border-radius:2px;margin-top:4px}
#pg{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}

/* ── TTS Panel ── */
#ttp{position:fixed;bottom:62px;right:14px;background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:14px;width:230px;box-shadow:0 6px 24px rgba(0,0,0,.6);display:none;z-index:40}
#ttp.show{display:block}
#ttp h4{font-size:12px;color:var(--ac);margin-bottom:11px;font-weight:600}
.tr{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;color:var(--txd)}
.tr label{width:46px;flex-shrink:0}
.tr input[type=range]{flex:1;accent-color:var(--ac);height:20px}
.tr span{width:30px;text-align:right;font-size:11px;color:var(--tx)}
#tvsel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:6px;font-size:12px;margin-bottom:9px;outline:none;-webkit-appearance:none}
#tplaybtn{width:100%;padding:8px;background:var(--ac);color:var(--bg);border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}

/* ── Settings Panel ── */
#setp{position:fixed;top:58px;right:14px;background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:14px;width:230px;box-shadow:0 6px 24px rgba(0,0,0,.6);display:none;z-index:40}
#setp.show{display:block}
#setp h4{font-size:12px;color:var(--ac);margin-bottom:12px;font-weight:600}
.srow{display:flex;align-items:center;gap:7px;margin-bottom:11px;font-size:12px;color:var(--txd)}
.srow label{flex:1}
.srow input[type=range]{width:80px;accent-color:var(--ac);height:20px}
.srow span{width:28px;font-size:11px;color:var(--tx);text-align:right}
.thr{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.thb{padding:4px 9px;border-radius:5px;border:1px solid var(--bd);font-size:11px;cursor:pointer;background:var(--pn);color:var(--txd);-webkit-appearance:none}
.thb.on{border-color:var(--ac);color:var(--ac)}

/* ── Overlay (sidebar backdrop on mobile) ── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
#overlay.show{display:block}

/* ── Key hint ── */
#kh{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:var(--ac2);border-radius:6px;padding:6px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;white-space:nowrap}
#kh.show{opacity:1}

.inp{flex:1;padding:10px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;outline:none;-webkit-appearance:none;min-width:0}
.inp:focus{border-color:var(--ac)}
/* Spinner */
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Themes */
body.tp{--bg:#f2ece0;--sf:#e8e0d0;--pn:#ddd5c3;--bd:#c5baa8;--tx:#201508;--txd:#6b5e4a;--txr:#a08870;--ac:#8b5e28;--ac2:#7a4e1c;--warn:#a07820}
body.te{--bg:#0e1a0f;--sf:#131f14;--pn:#172518;--bd:#223325;--tx:#c8e8cc;--txd:#68906c;--txr:#38583c;--ac:#58b870;--ac2:#78d090}
body.tb{--bg:#0c1520;--sf:#101c2a;--pn:#152235;--bd:#1e3045;--tx:#c8dce8;--txd:#6088a8;--txr:#386075;--ac:#58aace;--ac2:#78c2e0}

@media(max-width:680px){
  :root{--sw:82vw;--fs:17px}
  #sb{position:absolute;height:100%;transform:translateX(-110%)}
  #sb.open{transform:translateX(0)}
  #rc{padding:28px 16px 110px}
}
</style>
</head>
<body>
<div id="overlay" onclick="closeSB()"></div>
<div id="app">

<!-- Sidebar -->
<div id="sb" id="sb">
  <div id="sbh"><span>📚</span><h1 id="ns">小說閱讀器</h1></div>
  <input id="tcq" type="search" placeholder="搜尋章節…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="tcl"></div>
  <div id="sbf">0 / 0 章</div>
</div>

<!-- Main -->
<div id="mn">
  <div id="topbar">
    <button class="btn" id="btoc" aria-label="目錄">☰</button>
    <div class="sep"></div>
    <button class="btn" id="bnew">＋ 新書</button>
    <div class="sep"></div>
    <div id="chtl">—</div>
    <div class="sep"></div>
    <button class="btn" id="btts">🔊</button>
    <button class="btn" id="bset">⚙</button>
  </div>

  <div id="rw" tabindex="0">
    <!-- Welcome -->
    <div id="wc">
      <div class="wlogo">📖</div>
      <div class="wtitle">小說閱讀器</div>
      <div class="wsub">iPad 離線版 · 免費 · 不佔 AI 額度</div>

      <!-- How to use -->
      <!-- URL auto-fetch mode -->
      <div class="card" id="card-url">
        <h3>🔗 自動抓取（輸入網址）</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input id="urlin" class="inp" type="url" placeholder="https://www.xbanxia.cc/books/98237.html" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="gbtn" id="fetchbtn" style="width:auto;padding:10px 16px">抓取</button>
        </div>
        <div id="fetchbar-w" style="width:100%;height:4px;background:var(--bd);border-radius:2px;margin-bottom:8px;display:none"><div id="fetchbar-f" style="height:100%;background:var(--ac);border-radius:2px;transition:width .3s;width:0%"></div></div>
        <div id="fetchlog" style="background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--txd);max-height:160px;overflow-y:auto;display:none;line-height:1.65;font-family:monospace"></div>
      </div>

      <div style="text-align:center;font-size:12px;color:var(--txr);margin:4px 0 4px">─── 或 ───</div>

      <div class="card">
        <h3>📥 書籤工具（手動複製）</h3>
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">
            <strong>安裝書籤工具（只需一次）</strong>
            在 Safari 書籤裡新增一個書籤，把網址改成下方程式碼
          </div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">
            <strong>到小說章節頁面點書籤</strong>
            自動複製全頁文字
          </div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">
            <strong>回到閱讀器貼上 → 點解析</strong>
          </div>
        </div>
        <div class="bkl-wrap" style="margin-top:14px">
          <a id="bkl" href="#BOOKMARKLET">📖 複製小說文字</a>
          <div class="bkl-note">⬆️ 長按此按鈕 → 加入書籤<br>（在 Safari 中才能運作，需長按加入書籤列）</div>
        </div>
      </div>

      <!-- Paste area -->
      <div class="card">
        <h3>📋 貼上目錄 / 章節文字</h3>
        <textarea id="pa" placeholder="把複製的小說頁面文字貼在這裡…&#10;&#10;支援：&#10;• 目錄頁（自動列出所有章節名稱）&#10;• 單章節內文（直接閱讀）&#10;• 多章連續文字（自動分割）"></textarea>
        <input id="ptitle" type="text" placeholder="小說標題（選填，會自動偵測）" autocorrect="off" spellcheck="false">
        <div id="pbar-w"><div id="pbar-f"></div></div>
        <div id="pstat"></div>
        <button class="gbtn" onclick="doParse()">✨ 解析並載入</button>
      </div>

    </div><!-- /welcome -->

    <!-- Reading -->
    <div id="rc">
      <div id="chhd"></div>
      <div id="nt"></div>
    </div>
  </div><!-- /rw -->

  <div id="bb">
    <button class="nb" id="pvbtn">← 上章</button>
    <div><div id="pind">—</div><div id="pgw"><div id="pg" style="width:0%"></div></div></div>
    <button class="nb" id="nxbtn">下章 →</button>
  </div>
</div><!-- /mn -->
</div><!-- /app -->

<!-- TTS -->
<div id="ttp">
  <h4>🔊 語音朗讀</h4>
  <select id="tvsel"></select>
  <div class="tr"><label>語速</label><input type="range" id="trate" min="0.5" max="2.5" step="0.1" value="1.0"><span id="rv">1.0</span></div>
  <div class="tr"><label>音調</label><input type="range" id="tpitch" min="0.5" max="2" step="0.1" value="1.0"><span id="pv">1.0</span></div>
  <div class="tr"><label>音量</label><input type="range" id="tvol" min="0" max="1" step="0.05" value="1.0"><span id="vv">1.0</span></div>
  <button id="tplaybtn">▶ 開始朗讀</button>
</div>

<!-- Settings -->
<div id="setp">
  <h4>⚙ 閱讀設定</h4>
  <div class="srow"><label>字體大小</label><input type="range" id="fsr" min="14" max="30" step="1" value="19"><span id="fsv">19</span></div>
  <div class="srow"><label>行距</label><input type="range" id="lhr" min="1.4" max="3.2" step="0.1" value="2.1"><span id="lhv">2.1</span></div>
  <div class="srow" style="flex-direction:column;align-items:flex-start;gap:6px">
    <label>主題</label>
    <div class="thr">
      <button class="thb on" data-th="">🌙 深夜</button>
      <button class="thb" data-th="tp">📜 紙張</button>
      <button class="thb" data-th="te">🌿 護眼</button>
      <button class="thb" data-th="tb">🌊 夜藍</button>
    </div>
  </div>
</div>

<div id="kh"></div>

<script>
// ──────────────────────────────────────────────────────────────
// 完全不依賴 Claude API，純前端解析
// ──────────────────────────────────────────────────────────────
const G = { novel:null, idx:0, read:new Set(), ttsOn:false };
const $= id => document.getElementById(id);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── Bookmarklet ───────────────────────────────────────────────
// Set real bookmarklet href on load (can't be inline due to length)
(function(){
  var code = '(function(){' +
    'var t=document.title;' +
    'var b=document.body.innerText||document.body.textContent;' +
    'var out="TITLE:"+t+"\\n\\n"+b;' +
    'if(navigator.clipboard&&navigator.clipboard.writeText){' +
    '  navigator.clipboard.writeText(out).then(function(){alert("✅ 已複製《"+t+"》\\n請回閱讀器貼上");},function(){fallback(out)});' +
    '}else{fallback(out);}' +
    'function fallback(s){var ta=document.createElement("textarea");ta.value=s;ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");alert("✅ 已複製《"+t+"》\\n請回閱讀器貼上");}catch(e){alert("複製失敗，請手動全選後複製");}document.body.removeChild(ta);}' +
    '})();';
  $('bkl').href = 'javascript:' + code;
})();

// ── Status / progress ─────────────────────────────────────────
function setStat(msg, cls){
  var e=$('pstat'); e.innerHTML=msg; e.className=cls||'';
}
function setBar(pct){
  var w=$('pbar-w'); w.classList.toggle('show',pct>0&&pct<100);
  $('pbar-f').style.width=pct+'%';
}

// ── Chapter pattern detection ─────────────────────────────────
const CH_PATS = [
  // 第X章 / 第X節 / 第X話 etc.
  /^[\s　]*第[\s]*[零○〇一二三四五六七八九十百千萬億\d]+[\s]*[章节節回集話话篇卷部]/m,
  // Chapter N / CHAPTER N
  /^[\s]*[Cc]hapter[\s]*\d+/m,
  // 序章 番外 尾聲 extra
  /^[\s　]*(序章|序曲|前言|番外|尾聲|終章|終曲|後記|楔子|外傳)/m,
];

function looksLikeChapterTitle(line) {
  line = line.trim();
  if (!line || line.length > 80) return false;
  return CH_PATS.some(p => p.test(line));
}

// ── Parse pasted text ─────────────────────────────────────────
function parseText(raw) {
  // Strip bookmarklet prefix
  let text = raw.trim();
  let title = '';
  if (text.startsWith('TITLE:')) {
    const nl = text.indexOf('\n');
    title = text.substring(6, nl).trim();
    text = text.substring(nl + 1).trim();
  }
  // Also handle if TITLE line itself is encoded
  try {
    if (title && title.indexOf('%') !== -1) title = decodeURIComponent(title.replace(/\+/g,' '));
  } catch(e) {}
  // Decode URL-encoded text (e.g. %E5%8D%... from some browsers)
  if (text.indexOf('%') !== -1 && /%[0-9A-Fa-f]{2}/.test(text)) {
    try { text = decodeURIComponent(text.replace(/\+/g,' ')); } catch(e) {}
  }

  // Strip HTML if someone pasted raw HTML
  if (/<html/i.test(text) || /<body/i.test(text)) {
    const d = document.createElement('div');
    d.innerHTML = text;
    ['script','style','nav','header','footer'].forEach(t => d.querySelectorAll(t).forEach(e=>e.remove()));
    text = d.innerText || d.textContent || text;
  }

  const lines = text.split('\n');

  // Find title if not set
  if (!title) {
    // Try first non-empty short line
    for (const l of lines) {
      const t = l.trim();
      if (t && t.length < 50 && t.length > 1) { title = t; break; }
    }
  }

  // Detect chapter boundary lines
  const chStarts = []; // indices of lines that start a chapter
  for (let i = 0; i < lines.length; i++) {
    if (looksLikeChapterTitle(lines[i])) chStarts.push(i);
  }

  if (chStarts.length >= 2) {
    // Multi-chapter: split at chapter title lines
    const chapters = [];
    for (let c = 0; c < chStarts.length; c++) {
      const start = chStarts[c];
      const end   = c + 1 < chStarts.length ? chStarts[c+1] : lines.length;
      const chTitle = lines[start].trim();
      const content = lines.slice(start + 1, end)
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      chapters.push({ title: chTitle, content });
    }
    return { title: title || chapters[0].title, chapters };
  }

  if (chStarts.length === 1) {
    // Single chapter with clear title
    const chTitle = lines[chStarts[0]].trim();
    const content = lines.slice(chStarts[0] + 1).join('\n').replace(/\n{3,}/g,'\n\n').trim();
    return { title: title || chTitle, chapters: [{ title: chTitle, content }] };
  }

  // No chapter markers — check if it looks like a TOC (many short lines)
  const shortLines = lines.filter(l => { const t=l.trim(); return t.length>1 && t.length<60; });
  if (shortLines.length > 5 && shortLines.length / lines.filter(l=>l.trim()).length > 0.6) {
    // Treat each line as a chapter title placeholder (TOC mode)
    const chapters = shortLines
      .filter(l => l.trim().length > 2)
      .map(l => ({ title: l.trim(), content: '' }));
    if (chapters.length > 0) {
      return { title: title || '（目錄）', chapters, isTOC: true };
    }
  }

  // Fallback: treat entire text as one chapter, split by blank lines into paragraphs
  if (text.length > 100) {
    return {
      title: title || '未命名',
      chapters: [{ title: title || '內文', content: text }]
    };
  }

  return null;
}

// ── doParse ───────────────────────────────────────────────────
window.doParse = function() {
  const raw = $('pa').value;
  const titleHint = $('ptitle').value.trim();
  if (!raw.trim()) { setStat('❌ 請先貼上文字', 'err'); return; }

  setStat('<span class="spin"></span> 解析中…');
  setBar(30);

  setTimeout(function() { // let UI update
    let text = raw;
    if (titleHint && !text.startsWith('TITLE:')) text = 'TITLE:' + titleHint + '\n\n' + text;

    const result = parseText(text);
    setBar(80);

    if (!result) { setStat('❌ 無法識別小說格式，請確認貼上內容', 'err'); setBar(0); return; }

    if (result.isTOC) {
      setStat('⚠️ 偵測到目錄頁（' + result.chapters.length + ' 章），章節無內文。<br>請到每個章節頁面，用書籤工具複製後貼上。', 'warn');
      setBar(0);
      // Still load so user can see the chapter list
    } else {
      setStat('✅ 解析完成：《' + result.title + '》共 ' + result.chapters.length + ' 章', 'ok');
    }
    setBar(0);
    loadNovel(result, '');
  }, 30);
};

// ── Load novel ────────────────────────────────────────────────
function loadNovel(data, url) {
  G.novel = { ...data, url };
  G.idx = 0;
  G.read = new Set();
  $('ns').textContent = data.title.length > 14 ? data.title.substring(0,14)+'…' : data.title;
  buildTOC();
  showChapter(0);
  $('wc').style.display = 'none';
  $('rc').style.display = 'block';
  save();
}

// ── TOC ───────────────────────────────────────────────────────
function buildTOC(q) {
  if (!G.novel) return;
  const list = $('tcl'); list.innerHTML = '';
  const ql = (q||'').toLowerCase();
  G.novel.chapters.forEach(function(ch, i) {
    if (ql && ch.title.toLowerCase().indexOf(ql) < 0) return;
    const d = document.createElement('div');
    d.className = 'ti' + (i===G.idx?' active':'') + (G.read.has(i)?' read':'');
    d.setAttribute('data-i', i);
    d.innerHTML = '<div class="tin">第'+(i+1)+'章</div>' + esc(ch.title);
    d.addEventListener('click', function(){
      showChapter(+this.getAttribute('data-i'));
      if (window.innerWidth <= 680) closeSB();
    });
    list.appendChild(d);
  });
  $('sbf').textContent = '已讀 '+G.read.size+' / '+G.novel.chapters.length+' 章';
}
$('tcq').addEventListener('input', function(){ buildTOC(this.value); });

// Update single TOC item after chapter loads
function updateTOCItem(i) {
  var el = document.querySelector('.ti[data-i="'+i+'"]');
  if (!el) return;
  var ch = G.novel.chapters[i];
  el.className = 'ti' + (i===G.idx?' active':'') + (G.read.has(i)?' read':'');
  el.innerHTML = '<div class="tin">第'+(i+1)+'章</div>' + esc(ch.title);
  el.addEventListener('click', function(){
    showChapter(+this.getAttribute('data-i'));
    if (window.innerWidth <= 680) closeSB();
  });
}

// ── Show chapter ──────────────────────────────────────────────
function showChapter(i) {
  if (!G.novel) return;
  const chs = G.novel.chapters;
  if (i < 0 || i >= chs.length) return;
  G.idx = i; G.read.add(i);
  const ch = chs[i];
  $('chhd').textContent = ch.title;
  $('chtl').textContent = ch.title;
  const paras = (ch.content||'').split('\n').filter(function(l){return l.trim();});
  if (paras.length) {
    $('nt').innerHTML = paras.map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
  } else {
    $('nt').innerHTML = '<p style="color:var(--txd);text-align:center">（本章無內文）</p>';
  }
  $('rw').scrollTop = 0;
  $('pvbtn').disabled = (i===0);
  $('nxbtn').disabled = (i===chs.length-1);
  var pct = chs.length>1 ? Math.round(i/(chs.length-1)*100) : 100;
  $('pg').style.width = pct+'%';
  $('pind').textContent = '第'+(i+1)+' / '+chs.length+'章';
  // Update TOC highlight
  document.querySelectorAll('.ti').forEach(function(el){
    var n = +el.getAttribute('data-i');
    el.className = 'ti'+(n===i?' active':'')+(G.read.has(n)?' read':'');
    if (n===i) el.scrollIntoView({block:'nearest'});
  });
  if (G.ttsOn) stopTTS();
  save();
  $('rw').focus();
}

// ── Swipe support (iPad) ──────────────────────────────────────
var touchStartX = 0, touchStartY = 0;
$('rw').addEventListener('touchstart', function(e){ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
$('rw').addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)*2 && Math.abs(dx) > 60) {
    // Horizontal swipe
    if (dx < 0) showChapter(G.idx+1); // swipe left = next
    else showChapter(G.idx-1);        // swipe right = prev
  }
}, {passive:true});

// ── Keyboard ─────────────────────────────────────────────────
var KH=$('kh'), kht;
function hint(m){KH.textContent=m;KH.classList.add('show');clearTimeout(kht);kht=setTimeout(function(){KH.classList.remove('show');},1100);}
document.addEventListener('keydown', function(e){
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  switch(e.key){
    case 'ArrowLeft': e.preventDefault(); showChapter(G.idx-1); hint('← 上一章'); break;
    case 'ArrowRight': e.preventDefault(); showChapter(G.idx+1); hint('→ 下一章'); break;
    case 'ArrowUp': e.preventDefault(); scr(-1); break;
    case 'ArrowDown': e.preventDefault(); scr(1); break;
    case ' ': case 'PageDown': e.preventDefault(); scr(1,true); hint('▼ 翻頁'); break;
    case 'PageUp': e.preventDefault(); scr(-1,true); hint('▲ 翻頁'); break;
    case 'Home': e.preventDefault(); if(G.novel){showChapter(0);hint('⏮ 第一章');} break;
    case 'End': e.preventDefault(); if(G.novel){showChapter(G.novel.chapters.length-1);hint('⏭ 最後章');} break;
    case 't': case 'T': togSB(); break;
    case 's': case 'S': togTTS(); break;
    case 'AudioVolumeDown': e.preventDefault(); showChapter(G.idx-1); hint('← 上一章'); break;
    case 'AudioVolumeUp': e.preventDefault(); showChapter(G.idx+1); hint('→ 下一章'); break;
    case 'MediaTrackPrevious': e.preventDefault(); showChapter(G.idx-1); hint('← 上一章'); break;
    case 'MediaTrackNext': e.preventDefault(); showChapter(G.idx+1); hint('→ 下一章'); break;
  }
});

// ── Cloudflare Worker proxy ──────────────────────────────────
const PROXY = 'https://novel-proxy.runrain.workers.dev/';

function proxyUrl(url) {
  return PROXY + '?url=' + encodeURIComponent(url);
}

function fetchPage(url) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proxyUrl(url), true);
    xhr.timeout = 15000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 400) resolve(xhr.responseText);
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = function() { reject(new Error('網路錯誤')); };
    xhr.ontimeout = function() { reject(new Error('逾時')); };
    xhr.send();
  });
}

function flog(msg, cls) {

}
function flogClear() { var b=$('fetchlog'); b.innerHTML=''; b.style.display='none'; }
function fbar(pct) {

  $('fetchbar-f').style.width = pct + '%';
}

// ── HTML parser helpers ───────────────────────────────────────
function domFromHtml(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  return d;
}

function extractLinks(html, baseUrl) {
  // Parse chapter links from index page
  var dom = domFromHtml(html);
  var base = new URL(baseUrl);
  var links = [];
  var seen = new Set();
  // Look for links that look like chapter URLs
  dom.querySelectorAll('a[href]').forEach(function(a) {
    var href = a.getAttribute('href');
    if (!href) return;
    var full;
    try {
      full = new URL(href, baseUrl).href;
    } catch(e) { return; }
    // Must be same domain, and URL pattern suggests a chapter (has numeric ID)
    if (full.indexOf(base.hostname) < 0) return;
    if (seen.has(full)) return;
    var text = (a.textContent || '').trim();
    if (!text || text.length > 60 || text.length < 2) return;
    // Filter out nav/menu links - chapter links usually have chapter-like text
    if (/首頁|登入|登錄|註冊|搜尋|關於|聯繫|排行|分類|書架|目錄$/.test(text)) return;
    seen.add(full);
    links.push({ title: text, url: full });
  });
  return links;
}

function extractChapterContent(html, chapterTitle) {
  var dom = domFromHtml(html);
  // Remove noise elements
  dom.querySelectorAll('script,style,nav,header,footer,.ad,#ad,[class*="ad-"],[id*="ad-"],noscript,aside').forEach(function(e){ e.remove(); });

  // Common content selectors for novel sites
  var selectors = [
    '#chaptercontent', '#chapter-content', '.chapter-content',
    '#content', '.content', '#articlecontent',
    '.article-content', '#booktext', '.booktext',
    'article', '.novel-content', '#novel-content',
    '.text-content', '#text'
  ];

  var content = '';
  for (var i = 0; i < selectors.length; i++) {
    var el = dom.querySelector(selectors[i]);
    if (el) {
      content = el.innerText || el.textContent || '';
      if (content.trim().length > 100) break;
    }
  }

  // Fallback: find the largest text block
  if (content.trim().length < 100) {
    var best = '', bestLen = 0;
    dom.querySelectorAll('p,div').forEach(function(el) {
      var t = (el.innerText || el.textContent || '').trim();
      if (t.length > bestLen && el.children.length < 20) {
        bestLen = t.length; best = t;
      }
    });
    content = best;
  }

  // Clean up
  content = content
    .split('\r\n').join('\n').split('\r').join('\n')
    .replace(/[ \t\u3000]+/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  // Remove common site noise from content
  var noisePatterns = ['本章未完', '閱讀.*?txt小說', '手機用戶請瀏覽'];
  noisePatterns.forEach(function(p) {
    try { content = content.replace(new RegExp(p + '[^\n]*', 'g'), ''); } catch(e) {}
  });
  content = content.trim();

  return content;
}

// ── Auto-fetch novel from URL ─────────────────────────────────
$('fetchbtn').addEventListener('click', function() {
  var url = $('urlin').value.trim();
  if (!url.startsWith('http')) {
    flogClear(); flog('❌ 請輸入完整網址（https://…）', 'err'); return;
  }
  doAutoFetch(url);
});
$('urlin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') $('fetchbtn').click();
});

async function doAutoFetch(url) {
  $('fetchbtn').disabled = true;
  flogClear();
  fbar(5);
  flog('<span class="spin"></span> 抓取目錄頁…');

  var indexHtml;
  try {
    indexHtml = await fetchPage(url);
  } catch(e) {
    flog('❌ 無法抓取頁面：' + e.message, 'err');
    flog('請確認 Cloudflare Worker 是否正常運作', 'warn');
    $('fetchbtn').disabled = false; fbar(0); return;
  }

  flog('✅ 目錄頁抓取成功', 'ok');
  fbar(15);

  // Parse title from page
  var titleMatch = indexHtml.match(/<title[^>]*>([^<]+)<\/title>/i);
  var novelTitle = titleMatch ? titleMatch[1].replace(/[-_|].*$/, '').trim() : '未命名小說';
  // Clean up title
  novelTitle = novelTitle.replace(/小說.*$/, '').replace(/在線.*$/, '').trim();

  flog('📚 小說：' + novelTitle);

  // Extract chapter links
  var chapters = extractLinks(indexHtml, url);

  if (chapters.length < 2) {
    flog('⚠️ 目錄頁章節連結太少（' + chapters.length + ' 個），嘗試解析為單章節…', 'warn');
    var content = extractChapterContent(indexHtml, novelTitle);
    if (content.length > 200) {
      loadNovel({ title: novelTitle, chapters: [{ title: novelTitle, content: content }] }, url);
      flog('✅ 載入完成', 'ok'); fbar(0);
    } else {
      flog('❌ 無法識別頁面內容，請改用貼上模式', 'err'); fbar(0);
    }
    $('fetchbtn').disabled = false; return;
  }

  flog('✅ 找到 ' + chapters.length + ' 個章節連結', 'ok');
  fbar(20);

  // Build novel skeleton immediately
  var novel = {
    title: novelTitle, url: url,
    chapters: chapters.map(function(c) { return { title: c.title, url: c.url, content: null }; })
  };
  G.novel = novel;
  G.idx = 0;
  G.read = new Set();
  $('ns').textContent = novelTitle.length > 14 ? novelTitle.substring(0,14)+'…' : novelTitle;
  buildTOC();
  $('wc').style.display = 'none';
  $('rc').style.display = 'block';
  // Show placeholder
  $('chhd').textContent = chapters[0].title;
  $('chtl').textContent = chapters[0].title;
  $('nt').innerHTML = '<p style="color:var(--txd);text-align:center"><span class="spin"></span> 載入第一章中…</p>';

  var total = chapters.length;
  var done = 0;
  var BATCH = 2; // fetch 2 at a time to avoid rate limiting

  async function fetchChapter(i) {
    var ch = novel.chapters[i];
    if (!ch.url) { ch.content = ''; return; }
    try {
      var html = await fetchPage(ch.url);
      ch.content = extractChapterContent(html, ch.title);
      if (!ch.content) ch.content = '（本章無法擷取內文）';
    } catch(e) {
      ch.content = '（載入失敗：' + e.message + '）';
    }
    done++;
    fbar(20 + Math.round(done / total * 75));
    if (done % 10 === 0 || done === 1) flog('✅ 已載入 ' + done + ' / ' + total + ' 章', 'ok');
    updateTOCItem(i);
    if (i === G.idx) showChapter(i); // refresh if currently viewing
  }

  // Fetch all chapters in batches
  for (var i = 0; i < total; i += BATCH) {
    var batch = [];
    for (var j = i; j < Math.min(i + BATCH, total); j++) {
      batch.push(fetchChapter(j));
    }
    await Promise.all(batch);
    // Small delay to be polite to the server
    if (i + BATCH < total) await new Promise(function(r){ setTimeout(r, 300); });
  }

  fbar(100);
  flog('🎉 全部 ' + total + ' 章載入完成！', 'ok');
  setTimeout(function(){ fbar(0); }, 2000);
  save();
  $('fetchbtn').disabled = false;
}

restore();
