<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>📖 小說閱讀器</title>
<style>
:root{
  --bg:#18140f;--sf:#221d17;--pn:#2a2318;--bd:#3a3028;
  --ac:#c9a96e;--ac2:#e8c98a;--tx:#ede3d5;--txd:#9a8f82;--txr:#504540;
  --err:#d07070;--ok:#70c080;--warn:#c9b070;
  --serif:'Georgia','Songti SC','Noto Serif TC',serif;
  --ui:-apple-system,'Segoe UI',system-ui,sans-serif;
  --sw:290px;--pm:720px;--fs:19px;--lh:2.1;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-text-size-adjust:100%}
#app{display:flex;height:100%;height:100dvh}

/* Sidebar */
#sb{width:var(--sw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .26s ease;z-index:20}
#sb.col{transform:translateX(-100%);position:absolute;height:100%}
#sbh{padding:14px 13px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
#sbh span{font-size:19px}
#sbh h1{font-size:13px;font-weight:600;color:var(--ac);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
/* Fetch status badge in sidebar */
#fetch-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bd);color:var(--txd);white-space:nowrap;flex-shrink:0;display:none}
#fetch-badge.loading{background:rgba(201,169,110,.2);color:var(--warn);display:inline-block}
#fetch-badge.done{background:rgba(112,192,128,.15);color:var(--ok);display:inline-block}
#fetch-badge.err{background:rgba(208,112,112,.15);color:var(--err);display:inline-block}
#tcq{margin:7px 10px;padding:7px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:14px;outline:none;width:calc(100% - 20px);-webkit-appearance:none}
#tcq:focus{border-color:var(--ac)}
#tcl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:3px 0}
.ti{padding:9px 13px;font-size:12.5px;cursor:pointer;color:var(--txd);border-left:3px solid transparent;line-height:1.45;transition:all .1s;user-select:none}
.ti:active{background:var(--pn)}
.ti.active{border-left-color:var(--ac);color:var(--ac2);background:var(--pn)}
.ti.read{color:var(--txr)}
.ti.loading{color:var(--warn);font-style:italic}
.tin{font-size:10px;color:var(--txr);margin-bottom:1px}
#sbf{padding:9px 13px;border-top:1px solid var(--bd);font-size:11px;color:var(--txr);text-align:center;padding-bottom:calc(9px + var(--safe-b))}

/* Main */
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:5px;padding:0 11px;flex-shrink:0}
.btn{background:none;border:1px solid var(--bd);color:var(--txd);padding:5px 9px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap;-webkit-appearance:none;user-select:none;transition:all .12s}
.btn:active,.btn:hover{color:var(--tx);border-color:var(--ac)}
.btn.on{color:var(--ac);border-color:var(--ac);background:rgba(201,169,110,.1)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 2px;flex-shrink:0}
#chtl{flex:1;font-size:13px;color:var(--txd);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Reader */
#rw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
#rw::-webkit-scrollbar{display:none}
#rc{display:none;max-width:var(--pm);margin:0 auto;padding:40px 26px 110px}
#chhd{font-size:20px;font-family:var(--serif);color:var(--ac2);margin-bottom:26px;line-height:1.5;text-align:center;border-bottom:1px solid var(--bd);padding-bottom:16px}
#nt{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx)}
#nt p{margin-bottom:1.15em;text-indent:2em}

/* Welcome */
#wc{max-width:600px;margin:0 auto;padding:26px 18px;padding-bottom:calc(26px + var(--safe-b))}
.wlogo{font-size:48px;text-align:center;margin-bottom:9px}
.wtitle{font-size:21px;color:var(--ac2);font-family:var(--serif);text-align:center;margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--ac);margin-bottom:12px;font-weight:600}
.inp{flex:1;padding:10px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;outline:none;-webkit-appearance:none;min-width:0}
.inp:focus{border-color:var(--ac)}
.irow{display:flex;gap:7px;margin-bottom:10px}
.gbtn{padding:10px 16px;background:var(--ac);color:var(--bg);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;user-select:none;flex-shrink:0}
.gbtn:active{opacity:.8}
.gbtn.full{width:100%;padding:12px;font-size:15px;border-radius:9px}
.gbtn.sec{background:var(--pn);color:var(--txd);border:1px solid var(--bd)}
/* Fetch log */
#flog{background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--txd);max-height:140px;overflow-y:auto;display:none;line-height:1.65}
/* Progress */
#fprogw{width:100%;height:4px;background:var(--bd);border-radius:2px;margin:8px 0;display:none}
#fprogf{height:100%;background:var(--ac);border-radius:2px;transition:width .35s;width:0%}
/* Paste */
#pa{width:100%;height:140px;background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font-size:12.5px;resize:none;outline:none;display:block;-webkit-appearance:none;margin-bottom:8px}
#pa:focus{border-color:var(--ac)}
#ptitle{width:100%;padding:9px 11px;background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;font-size:13px;outline:none;-webkit-appearance:none;margin-bottom:8px}
#ptitle:focus{border-color:var(--ac)}
#pstat{font-size:12.5px;min-height:18px;margin-top:7px;line-height:1.5;color:var(--txd)}
#pstat.ok{color:var(--ok)} #pstat.err{color:var(--err)} #pstat.warn{color:var(--warn)}
/* Bookmarklet */
.bkl-wrap{text-align:center;margin-top:12px}
#bkl{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;background:linear-gradient(135deg,var(--ac),#b8882a);color:var(--bg);border-radius:8px;font-size:13.5px;font-weight:700;text-decoration:none}
.bkl-note{font-size:11px;color:var(--txr);margin-top:5px;line-height:1.5}

/* Bottom nav */
#bb{height:calc(52px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 13px;padding-bottom:var(--safe-b);flex-shrink:0}
.nb{background:var(--pn);border:1px solid var(--bd);color:var(--txd);padding:7px 15px;border-radius:8px;cursor:pointer;font-size:14px;-webkit-appearance:none;user-select:none}
.nb:active{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.nb:disabled{opacity:.25;pointer-events:none}
#pind{font-size:12px;color:var(--txd);text-align:center}
#pgw{width:90px;height:3px;background:var(--bd);border-radius:2px;margin-top:3px}
#pg{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}

/* ── Panels (TTS / Settings / Export) ── */
.panel{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:15px;box-shadow:0 6px 28px rgba(0,0,0,.65);display:none;z-index:40}
.panel.show{display:block}
.panel h4{font-size:12px;color:var(--ac);margin-bottom:12px;font-weight:600}
#ttp{bottom:62px;right:13px;width:232px}
#setp{top:58px;right:13px;width:248px}
#expp{top:58px;right:13px;width:280px}

/* TTS */
.tr{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;color:var(--txd)}
.tr label{width:46px;flex-shrink:0}
.tr input[type=range]{flex:1;accent-color:var(--ac);height:20px}
.tr span{width:30px;text-align:right;font-size:11px;color:var(--tx)}
#tvsel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:6px;font-size:11.5px;margin-bottom:9px;outline:none;-webkit-appearance:none}
#tplaybtn{width:100%;padding:8px;background:var(--ac);color:var(--bg);border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}

/* Settings */
.srow{display:flex;align-items:center;gap:7px;margin-bottom:11px;font-size:12px;color:var(--txd)}
.srow label{flex:1}
.srow input[type=range]{width:82px;accent-color:var(--ac);height:20px}
.srow span{width:28px;font-size:11px;color:var(--tx);text-align:right}
/* Theme buttons */
.thr{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.thb{padding:4px 9px;border-radius:5px;border:1px solid var(--bd);font-size:11px;cursor:pointer;background:var(--pn);color:var(--txd);-webkit-appearance:none}
.thb.on{border-color:var(--ac);color:var(--ac)}
/* Custom bg color row */
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.cbtn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.cbtn.on{border-color:var(--ac)}
#custom-bg{width:36px;height:26px;border-radius:5px;border:1px solid var(--bd);cursor:pointer;background:var(--bg);padding:0}

/* Export panel */
.exp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exp-row label{flex:1;font-size:12.5px;color:var(--txd)}
select.exp-sel{flex:1;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:6px 8px;border-radius:6px;font-size:12px;outline:none;-webkit-appearance:none}
.exp-btns{display:flex;gap:7px;margin-top:10px}
.exp-btns button{flex:1;padding:8px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.ebtn-exp{background:var(--ac);color:var(--bg)}
.ebtn-imp{background:var(--pn);color:var(--txd);border:1px solid var(--bd) !important}
#imp-file{display:none}

/* Overlay */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
#overlay.show{display:block}

/* Key hint */
#kh{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:var(--ac2);border-radius:6px;padding:5px 13px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;white-space:nowrap}
#kh.show{opacity:1}

.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Themes */
body.tp{--bg:#f2ece0;--sf:#e8e0d0;--pn:#ddd5c3;--bd:#c5baa8;--tx:#201508;--txd:#6b5e4a;--txr:#a08870;--ac:#8b5e28;--ac2:#7a4e1c}
body.te{--bg:#0e1a0f;--sf:#131f14;--pn:#172518;--bd:#223325;--tx:#c8e8cc;--txd:#68906c;--txr:#38583c;--ac:#58b870;--ac2:#78d090}
body.tb{--bg:#0c1520;--sf:#101c2a;--pn:#152235;--bd:#1e3045;--tx:#c8dce8;--txd:#6088a8;--txr:#386075;--ac:#58aace;--ac2:#78c2e0}

@media(max-width:680px){
  :root{--sw:82vw;--fs:17px}
  #sb{position:absolute;height:100%;transform:translateX(-110%)}
  #sb.open{transform:translateX(0)}
  #rc{padding:26px 15px 110px}
  #setp,#expp{top:auto;bottom:62px;right:13px;left:13px;width:auto}
}
</style>
</head>
<body>
<div id="overlay" onclick="closeSB()"></div>
<div id="app">

<!-- Sidebar -->
<div id="sb">
  <div id="sbh">
    <span>📚</span>
    <h1 id="ns">小說閱讀器</h1>
    <span id="fetch-badge">載入中</span>
  </div>
  <input id="tcq" type="search" placeholder="搜尋章節…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="tcl"></div>
  <div id="sbf">0 / 0 章</div>
</div>

<!-- Main -->
<div id="mn">
  <div id="topbar">
    <button class="btn" id="btoc">☰</button>
    <div class="sep"></div>
    <button class="btn" id="bnew">＋ 新書</button>
    <div class="sep"></div>
    <div id="chtl">—</div>
    <div class="sep"></div>
    <button class="btn" id="btts">🔊</button>
    <button class="btn" id="bset">⚙</button>
    <button class="btn" id="bexp">📦</button>
  </div>

  <div id="rw" tabindex="0">
    <!-- Welcome -->
    <div id="wc">
      <div class="wlogo">📖</div>
      <div class="wtitle">小說閱讀器</div>

      <!-- Auto fetch -->
      <div class="card">
        <h3>🔗 自動抓取（輸入網址）</h3>
        <div class="irow">
          <input class="inp" id="urlin" type="url" placeholder="https://www.xbanxia.cc/books/12345.html" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="gbtn" id="fetchbtn">抓取</button>
        </div>
        <div id="fprogw"><div id="fprogf"></div></div>
        <div id="flog"></div>
      </div>

      <div style="text-align:center;font-size:12px;color:var(--txr);margin:2px 0">── 或 ──</div>

      <!-- Paste -->
      <div class="card">
        <h3>📋 貼上文字</h3>
        <textarea id="pa" placeholder="把複製的小說文字貼在這裡…"></textarea>
        <input class="inp" id="ptitle" type="text" placeholder="小說標題（選填）" autocorrect="off" spellcheck="false" style="width:100%;margin-bottom:8px">
        <button class="gbtn full" onclick="doPaste()">✨ 解析並載入</button>
        <div id="pstat"></div>
        <div class="bkl-wrap">
          <a id="bkl" href="#BKL">📖 複製小說文字</a>
          <div class="bkl-note">長按 → 加入書籤，到小說頁點一下即可複製</div>
        </div>
      </div>
    </div><!-- /wc -->

    <!-- Reading -->
    <div id="rc">
      <div id="chhd"></div>
      <div id="nt"></div>
    </div>
  </div><!-- /rw -->

  <div id="bb">
    <button class="nb" id="pvbtn">← 上章</button>
    <div><div id="pind">—</div><div id="pgw"><div id="pg" style="width:0%"></div></div></div>
    <button class="nb" id="nxbtn">下章 →</button>
  </div>
</div><!-- /mn -->
</div><!-- /app -->

<!-- TTS Panel -->
<div id="ttp" class="panel">
  <h4>🔊 語音朗讀</h4>
  <select id="tvsel"></select>
  <div class="tr"><label>語速</label><input type="range" id="trate" min="0.5" max="2.5" step="0.1" value="1.0"><span id="rv">1.0</span></div>
  <div class="tr"><label>音調</label><input type="range" id="tpitch" min="0.5" max="2" step="0.1" value="1.0"><span id="pv">1.0</span></div>
  <div class="tr"><label>音量</label><input type="range" id="tvol" min="0" max="1" step="0.05" value="1.0"><span id="vv">1.0</span></div>
  <button id="tplaybtn">▶ 開始朗讀</button>
</div>

<!-- Settings Panel -->
<div id="setp" class="panel">
  <h4>⚙ 閱讀設定</h4>
  <div class="srow"><label>字體大小</label><input type="range" id="fsr" min="13" max="32" step="1" value="19"><span id="fsv">19</span></div>
  <div class="srow"><label>行距</label><input type="range" id="lhr" min="1.4" max="3.2" step="0.1" value="2.1"><span id="lhv">2.1</span></div>
  <div class="srow"><label>頁面寬度</label><input type="range" id="pmr" min="400" max="900" step="20" value="720"><span id="pmv" style="width:36px">720</span></div>
  <div class="srow" style="flex-direction:column;align-items:flex-start;gap:5px">
    <label>主題</label>
    <div class="thr">
      <button class="thb on" data-th="">🌙 深夜</button>
      <button class="thb" data-th="tp">📜 紙張</button>
      <button class="thb" data-th="te">🌿 護眼</button>
      <button class="thb" data-th="tb">🌊 夜藍</button>
    </div>
  </div>
  <div class="srow" style="flex-direction:column;align-items:flex-start;gap:5px">
    <label>自訂底色</label>
    <div class="color-row" id="bgpresets">
      <div class="cbtn" data-bg="" style="background:#18140f" title="深夜"></div>
      <div class="cbtn" data-bg="#f2ece0" style="background:#f2ece0" title="紙張"></div>
      <div class="cbtn" data-bg="#0e1a0f" style="background:#0e1a0f" title="護眼"></div>
      <div class="cbtn" data-bg="#1a1a2e" style="background:#1a1a2e" title="深藍"></div>
      <div class="cbtn" data-bg="#2d1b00" style="background:#2d1b00" title="暖棕"></div>
      <div class="cbtn" data-bg="#1a0a0a" style="background:#1a0a0a" title="深紅"></div>
      <input type="color" id="custom-bg" title="自訂顏色">
    </div>
  </div>
</div>

<!-- Export/Import Panel -->
<div id="expp" class="panel">
  <h4>📦 匯出 / 匯入</h4>
  <div class="exp-row">
    <label>匯出範圍</label>
    <select class="exp-sel" id="exp-sel">
      <option value="all">全部小說</option>
    </select>
  </div>
  <div class="exp-btns">
    <button class="exp-btns ebtn-exp" onclick="doExport()" style="flex:1;padding:9px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;background:var(--ac);color:var(--bg)">⬆️ 匯出 JSON</button>
    <button class="exp-btns ebtn-imp" onclick="document.getElementById('imp-file').click()" style="flex:1;padding:9px;border:1px solid var(--bd);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;background:var(--pn);color:var(--txd)">⬇️ 匯入 JSON</button>
  </div>
  <input type="file" id="imp-file" accept=".json">
  <div id="exp-stat" style="font-size:12px;color:var(--txd);margin-top:8px;min-height:16px"></div>
</div>

<div id="kh"></div>
<input type="file" id="imp-file2" accept=".json" style="display:none">

<script>
// ═══════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════
var G = {
  library: [],   // [{title, url, chapters:[{title,content,url}]}]
  cur: -1,       // index into library
  idx: 0,        // chapter index
  read: {},      // {novelIdx: Set}
  ttsOn: false,
  fetchTotal: 0,
  fetchDone: 0,
  fetching: false,
};
var SK = 'nr6';
var PROXY = 'https://novel-proxy.runrain.workers.dev/';

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

// ═══════════════════════════════════════════════════════════════
// Bookmarklet
// ═══════════════════════════════════════════════════════════════
(function(){
  var code = '(function(){var t=document.title;var b=document.body.innerText||document.body.textContent;var out="TITLE:"+t+"\\n\\n"+b;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out).then(function(){alert("✅ 已複製《"+t+"》\\n請回閱讀器貼上");},function(){fb(out)});}else{fb(out);}function fb(s){var ta=document.createElement("textarea");ta.value=s;ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");alert("✅ 已複製《"+t+"》\\n請回閱讀器貼上");}catch(e){alert("複製失敗，請手動全選複製");}document.body.removeChild(ta);}})();';
  $('bkl').href = 'javascript:' + code;
})();

// ═══════════════════════════════════════════════════════════════
// Fetch helpers
// ═══════════════════════════════════════════════════════════════
function proxyFetch(url, timeout) {
  timeout = timeout || 15000;
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', PROXY + '?url=' + encodeURIComponent(url), true);
    xhr.responseType = 'arraybuffer';
    xhr.timeout = timeout;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 400) {
        // Decode with UTF-8, fallback to GBK
        var bytes = new Uint8Array(xhr.response);
        var text = '';
        try { text = new TextDecoder('utf-8', {fatal:true}).decode(bytes); }
        catch(e) {
          try { text = new TextDecoder('gbk').decode(bytes); }
          catch(e2) { text = new TextDecoder('utf-8', {fatal:false}).decode(bytes); }
        }
        resolve(text);
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = function(){ reject(new Error('網路錯誤')); };
    xhr.ontimeout = function(){ reject(new Error('連線逾時')); };
    xhr.send();
  });
}

// ═══════════════════════════════════════════════════════════════
// HTML content extraction (improved)
// ═══════════════════════════════════════════════════════════════
function extractLinks(html, baseUrl) {
  var div = document.createElement('div');
  div.innerHTML = html;
  var base = '';
  try { base = new URL(baseUrl).origin; } catch(e){}
  var links = [], seen = {};
  div.querySelectorAll('a[href]').forEach(function(a) {
    var href = a.getAttribute('href')||'';
    if (!href || href==='#' || href.startsWith('javascript')) return;
    var full = '';
    try {
      full = href.startsWith('http') ? href : base + (href.startsWith('/') ? href : '/' + href);
    } catch(e){ return; }
    if (seen[full]) return;
    var text = (a.textContent||'').trim().replace(/\s+/g,' ');
    if (!text || text.length<2 || text.length>60) return;
    // Skip nav links
    if (/^(首頁|登[入錄]|註冊|搜[尋索]|排行|分類|書架|加入|收藏|上[一章]|下[一章]|目錄|返回|關於|聯繫|廣告|反饋|評[論價])$/.test(text)) return;
    seen[full] = true;
    links.push({title: text, url: full});
  });
  return links;
}

function extractContent(html, chTitle) {
  var div = document.createElement('div');
  // Only take body part to avoid head script issues
  var bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  div.innerHTML = bodyMatch ? bodyMatch[1] : html;

  // Remove noise
  var noiseSelectors = 'script,style,nav,header,footer,aside,iframe,noscript,' +
    '.ad,.ads,.advertisement,[class*="ad-"],[id*="ad-"],[class*="banner"],' +
    '[class*="recommend"],[class*="related"],[class*="comment"],[class*="pagination"],' +
    '[class*="navigation"],[class*="navbar"],[class*="breadcrumb"],.chapter-nav,' +
    '#chapter-nav,.booklist,.bookinfo,.author,.tags,.category';
  try { div.querySelectorAll(noiseSelectors).forEach(function(e){ e.remove(); }); } catch(e){}

  // Try known content selectors
  var selectors = [
    '#chaptercontent','#chapter_content','#ChapterContent',
    '#content','#Content','#booktext','#BookText',
    '.chapter-content','.chaptercontent','.read-content',
    '.content-text','#readcontent','#article','.article-body',
    '#articleBody','#novel-content','.novel-text','#novelcontent',
    'article .content','main .content','.container .content'
  ];
  var content = '';
  for (var i=0; i<selectors.length; i++) {
    var el = null;
    try { el = div.querySelector(selectors[i]); } catch(e){}
    if (el) {
      var t = (el.innerText || el.textContent || '').trim();
      if (t.length > 200) { content = t; break; }
    }
  }

  // Fallback: find largest text block that isn't nav
  if (content.length < 200) {
    var best = '', bestScore = 0;
    div.querySelectorAll('div,section,article').forEach(function(el) {
      if (el.children.length > 30) return; // skip containers
      var t = (el.innerText || el.textContent || '').trim();
      var score = t.length - el.querySelectorAll('a').length * 20;
      if (score > bestScore && t.length > 200) {
        bestScore = score; best = t;
      }
    });
    content = best;
  }

  // Clean up the content
  content = content
    .split('\r\n').join('\n').split('\r').join('\n')
    .replace(/\t/g,' ')
    .replace(/[^\S\n]{2,}/g,' ')  // multiple spaces -> single
    .replace(/\n{3,}/g,'\n\n')
    .trim();

  // Remove noise lines (ads, navigation snippets mixed in)
  var noiseLines = [
    /^本章未完/,'^閱讀.*?(txt|小說)','^手機用戶.*?請','^請記住.*?網址',
    '^如果.*?覺得.*?不錯','筆趣閣','求書網','頂點小說',
    '^上一章','^下一章','^章節目錄','^返回',
    /^第.{0,5}頁/,/^\d+\/\d+$/
  ];
  var lines = content.split('\n');
  lines = lines.filter(function(line) {
    var t = line.trim();
    if (!t) return true; // keep blank lines for spacing
    for (var i=0; i<noiseLines.length; i++) {
      var p = noiseLines[i];
      if (typeof p === 'string') { if (new RegExp(p).test(t)) return false; }
      else { if (p.test(t)) return false; }
    }
    return true;
  });
  content = lines.join('\n').replace(/\n{3,}/g,'\n\n').trim();

  // Try to strip content BEFORE the actual chapter start
  // Find where the chapter title or first paragraph starts
  if (chTitle && chTitle.length > 2) {
    var titleIdx = content.indexOf(chTitle);
    if (titleIdx > 0 && titleIdx < content.length * 0.3) {
      // Title found in first 30% - skip it and start from after
      content = content.substring(titleIdx + chTitle.length).trim();
    }
  }
  // Also try to find chapter marker like 第X章 near the start
  var chMarker = content.match(/^[\s\S]{0,300}(第[零一二三四五六七八九十百千\d]+[章節回][\s\S]{0,50}\n)/);
  if (chMarker) {
    var cut = content.indexOf(chMarker[1]) + chMarker[1].length;
    if (cut < content.length * 0.2) {
      content = content.substring(cut).trim();
    }
  }

  return content;
}

function extractTitle(html) {
  var m = html.match(/<title[^>]*>([^<]+)<\/title>/i);
  if (!m) return '未命名';
  var t = m[1];
  // Clean common suffixes from novel sites
  t = t.replace(/[-_|丨–—].*$/, '')
       .replace(/最新章節.*$/, '')
       .replace(/在線.*$/, '')
       .replace(/免費.*$/, '')
       .replace(/小說.*$/, '')
       .trim();
  return t || '未命名';
}

// Auto-fetch flow
// ═══════════════════════════════════════════════════════════════
$('fetchbtn').addEventListener('click', function() {
  var url = $('urlin').value.trim();
  if (!url.startsWith('http')) { flogClear(); flog('❌ 請輸入完整網址', 'err'); return; }
  doAutoFetch(url);
});
$('urlin').addEventListener('keydown', function(e){ if(e.key==='Enter') $('fetchbtn').click(); });

async function doAutoFetch(url) {
  if (G.fetching) return;
  G.fetching = true;
  $('fetchbtn').disabled = true;
  flogClear(); fbar(5);
  setBadge('loading','抓取中…');
  flog('<span class="spin"></span> 正在抓取目錄頁…');

  var indexHtml;
  try {
    indexHtml = await proxyFetch(url, 15000);
  } catch(e) {
    flog('❌ 抓取失敗：' + e.message, 'err');
    flog('請確認 Cloudflare Worker 是否正常：' + PROXY, 'warn');
    setBadge('err','抓取失敗');
    G.fetching=false; $('fetchbtn').disabled=false; fbar(0); return;
  }

  var novelTitle = extractTitle(indexHtml);
  flog('✅ 目錄頁成功（' + Math.round(indexHtml.length/1024) + 'KB）', 'ok');
  flog('📚 《' + novelTitle + '》');
  fbar(15);

  var chapters = extractLinks(indexHtml, url);
  if (chapters.length < 2) {
    // Maybe it's a single chapter page
    var singleContent = extractContent(indexHtml, novelTitle);
    if (singleContent.length > 200) {
      flog('→ 偵測為單頁，直接載入', 'warn');
      addToLibrary({title:novelTitle, url:url, chapters:[{title:novelTitle, content:singleContent}]});
      flog('✅ 完成', 'ok'); fbar(0);
      setBadge('done','已完成');
      G.fetching=false; $('fetchbtn').disabled=false; return;
    }
    flog('❌ 找不到章節連結（找到' + chapters.length + '個），請確認此為目錄頁', 'err');
    setBadge('err','無章節'); G.fetching=false; $('fetchbtn').disabled=false; fbar(0); return;
  }

  flog('✅ 找到 ' + chapters.length + ' 個章節', 'ok');
  fbar(20);

  // Create novel and add to library
  var novel = {
    title: novelTitle, url: url,
    chapters: chapters.map(function(c){ return {title:c.title, url:c.url, content:null}; })
  };
  var nIdx = addToLibrary(novel);
  switchNovel(nIdx);

  // Show placeholder in reader
  $('chhd').textContent = chapters[0].title;
  $('chtl').textContent = chapters[0].title;
  $('nt').innerHTML = '<p style="color:var(--txd);text-align:center"><span class="spin"></span> 正在載入第一章…</p>';

  G.fetchTotal = chapters.length;
  G.fetchDone = 0;
  setBadge('loading', '0/' + chapters.length);

  var BATCH = 2;
  var totalChaps = chapters.length;

  async function fetchChap(i) {
    var ch = G.library[nIdx].chapters[i];
    if (!ch || !ch.url) { ch.content=''; return; }
    try {
      var html = await proxyFetch(ch.url, 12000);
      ch.content = extractContent(html, ch.title);
      if (!ch.content) ch.content = '（無法擷取內文）';
    } catch(e) {
      ch.content = '（載入失敗：' + e.message + '）';
    }
    G.fetchDone++;
    fbar(20 + Math.round(G.fetchDone/totalChaps*75));
    setBadge('loading', G.fetchDone+'/'+totalChaps);
    updateTOCItem(i);
    if (i === G.idx && G.cur === nIdx) showChapter(i);
    if (G.fetchDone % 20 === 0) flog('📥 ' + G.fetchDone + '/' + totalChaps + ' 章已載入', 'ok');
    if (G.fetchDone === totalChaps) {
      flog('🎉 全部 ' + totalChaps + ' 章載入完成！', 'ok');
      setBadge('done','全'+totalChaps+'章 ✓');
      fbar(0); save();
    }
  }

  for (var i=0; i<totalChaps; i+=BATCH) {
    var batch=[];
    for (var j=i; j<Math.min(i+BATCH,totalChaps); j++) batch.push(fetchChap(j));
    await Promise.all(batch);
    if (i+BATCH < totalChaps) await new Promise(function(r){ setTimeout(r, 250); });
  }

  G.fetching=false; $('fetchbtn').disabled=false;
}

// ═══════════════════════════════════════════════════════════════
// Paste parse
// ═══════════════════════════════════════════════════════════════
window.doPaste = function() {
  var raw = $('pa').value;
  var titleHint = $('ptitle').value.trim();
  if (!raw.trim()) { setStat('❌ 請先貼上文字','err'); return; }
  setStat('<span class="spin"></span> 解析中…','');

  setTimeout(function() {
    var text = raw.trim();
    // URL decode if needed
    if (text.indexOf('%')!==-1 && /%[0-9A-Fa-f]{2}/.test(text)) {
      try { text = decodeURIComponent(text.replace(/\+/g,' ')); } catch(e){}
    }
    // Strip HTML
    if (/<html/i.test(text)||/<body/i.test(text)) {
      var d=document.createElement('div'); d.innerHTML=text;
      d.querySelectorAll('script,style').forEach(function(e){e.remove();});
      text = d.innerText||d.textContent||text;
    }
    // Bookmarklet prefix
    var title = titleHint;
    if (text.startsWith('TITLE:')) {
      var nl=text.indexOf('\n');
      if (!title) title=text.substring(6,nl).trim();
      try { if(title.indexOf('%')!==-1) title=decodeURIComponent(title.replace(/\+/g,' ')); }catch(e){}
      text=text.substring(nl+1).trim();
    }

    // Split into chapters
    var CH_RE = /(?=^[\s　]*第[\s]*[零○一二三四五六七八九十百千萬億\d]+[\s]*[章節回集話篇卷])/m;
    var parts = text.split(CH_RE).filter(function(x){return x.trim().length>10;});

    var chapters;
    if (parts.length >= 2) {
      chapters = parts.map(function(p) {
        var ls=p.trim().split('\n');
        return {title:ls[0].trim().substring(0,60)||'章節', content:ls.slice(1).join('\n').replace(/\n{3,}/g,'\n\n').trim()};
      });
    } else {
      // Single chapter
      chapters = [{title: title||'內文', content: text}];
    }

    if (!title && chapters.length) title = chapters[0].title;
    var novel = {title: title||'未命名', url:'', chapters:chapters};
    addToLibrary(novel);
    setStat('✅ 載入《' + novel.title + '》共 ' + chapters.length + ' 章','ok');
    fbar(0);
  }, 30);
};
function setStat(msg,cls){ var e=$('pstat'); e.innerHTML=msg; e.className=cls||''; }

// ═══════════════════════════════════════════════════════════════
// Library management
// ═══════════════════════════════════════════════════════════════
function addToLibrary(novel) {
  // Check if same URL already exists
  var existing = -1;
  if (novel.url) {
    for (var i=0; i<G.library.length; i++) {
      if (G.library[i].url === novel.url) { existing=i; break; }
    }
  }
  if (existing >= 0) {
    G.library[existing] = novel;
    switchNovel(existing);
    return existing;
  }
  G.library.push(novel);
  var nIdx = G.library.length - 1;
  switchNovel(nIdx);
  updateExpSel();
  return nIdx;
}

function switchNovel(nIdx) {
  G.cur = nIdx;
  G.idx = 0;
  if (!G.read[nIdx]) G.read[nIdx] = [];
  var novel = G.library[nIdx];
  $('ns').textContent = novel.title.length>14 ? novel.title.substring(0,14)+'…' : novel.title;
  buildTOC();
  showChapter(0);
  $('wc').style.display='none';
  $('rc').style.display='block';
  updateExpSel();
  save();
}

// ═══════════════════════════════════════════════════════════════
// TOC
// ═══════════════════════════════════════════════════════════════
function buildTOC(q) {
  if (G.cur<0||!G.library[G.cur]) return;
  var list=$('tcl'); list.innerHTML='';
  var ql=(q||'').toLowerCase();
  var novel=G.library[G.cur];
  var readSet = G.read[G.cur]||[];
  novel.chapters.forEach(function(ch,i) {
    if (ql && ch.title.toLowerCase().indexOf(ql)<0) return;
    var d=document.createElement('div');
    var isLoading=ch.content===null;
    var isRead=readSet.indexOf(i)>=0;
    d.className='ti'+(i===G.idx?' active':'')+(isRead?' read':'')+(isLoading?' loading':'');
    d.setAttribute('data-i',i);
    d.innerHTML='<div class="tin">第'+(i+1)+'章</div>'+esc(ch.title)+(isLoading?' <span style="font-size:9px;opacity:.6">…</span>':'');
    d.addEventListener('click',function(){
      showChapter(+this.getAttribute('data-i'));
      if(window.innerWidth<=680) closeSB();
    });
    list.appendChild(d);
  });
  $('sbf').textContent = '已讀 '+(G.read[G.cur]||[]).length+' / '+novel.chapters.length+' 章';
}
$('tcq').addEventListener('input',function(){ buildTOC(this.value); });

function updateTOCItem(i) {
  if (G.cur<0) return;
  var ch=G.library[G.cur].chapters[i];
  var el=document.querySelector('.ti[data-i="'+i+'"]');
  if(!el) return;
  var readSet=G.read[G.cur]||[];
  el.className='ti'+(i===G.idx?' active':'')+(readSet.indexOf(i)>=0?' read':'');
  el.innerHTML='<div class="tin">第'+(i+1)+'章</div>'+esc(ch.title);
  el.addEventListener('click',function(){
    showChapter(+this.getAttribute('data-i'));
    if(window.innerWidth<=680) closeSB();
  });
}

// ═══════════════════════════════════════════════════════════════
// Show chapter
// ═══════════════════════════════════════════════════════════════
function showChapter(i) {
  if (G.cur<0||!G.library[G.cur]) return;
  var chs=G.library[G.cur].chapters;
  if (i<0||i>=chs.length) return;
  G.idx=i;
  if (!G.read[G.cur]) G.read[G.cur]=[];
  if (G.read[G.cur].indexOf(i)<0) G.read[G.cur].push(i);
  var ch=chs[i];
  $('chhd').textContent=ch.title;
  $('chtl').textContent=ch.title;
  if (ch.content===null) {
    $('nt').innerHTML='<p style="color:var(--txd);text-align:center"><span class="spin"></span> 載入中…</p>';
  } else {
    var paras=(ch.content||'').split('\n').filter(function(l){return l.trim();});
    $('nt').innerHTML=paras.length
      ? paras.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')
      : '<p style="color:var(--txd);text-align:center">（本章無內文）</p>';
  }
  $('rw').scrollTop=0;
  $('pvbtn').disabled=(i===0);
  $('nxbtn').disabled=(i===chs.length-1);
  var pct=chs.length>1?Math.round(i/(chs.length-1)*100):100;
  $('pg').style.width=pct+'%';
  $('pind').textContent='第'+(i+1)+' / '+chs.length+'章';
  // Update TOC
  document.querySelectorAll('.ti').forEach(function(el){
    var n=+el.getAttribute('data-i');
    var readSet=G.read[G.cur]||[];
    el.className='ti'+(n===i?' active':'')+(readSet.indexOf(n)>=0?' read':'');
    if(n===i) el.scrollIntoView({block:'nearest'});
  });
  if(G.ttsOn) stopTTS();
  $('sbf').textContent='已讀 '+(G.read[G.cur]||[]).length+' / '+chs.length+'章';
  save();
  $('rw').focus();
}

// Swipe
var tx=0,ty=0;
$('rw').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$('rw').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)*2&&Math.abs(dx)>65){
    if(dx<0) showChapter(G.idx+1); else showChapter(G.idx-1);
  }
},{passive:true});

// Keyboard

var KH=$('kh'),kht;
function hint(m){KH.textContent=m;KH.classList.add('show');clearTimeout(kht);kht=setTimeout(function(){KH.classList.remove('show');},1100);}
document.addEventListener('keydown',function(e){
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  switch(e.key){
    case'ArrowLeft':e.preventDefault();showChapter(G.idx-1);hint('← 上一章');break;
    case'ArrowRight':e.preventDefault();showChapter(G.idx+1);hint('→ 下一章');break;
    case'ArrowUp':e.preventDefault();scr(-1);break;
    case'ArrowDown':e.preventDefault();scr(1);break;
    case' ':case'PageDown':e.preventDefault();scr(1,true);hint('▼ 翻頁');break;
    case'PageUp':e.preventDefault();scr(-1,true);hint('▲ 翻頁');break;
    case'Home':e.preventDefault();showChapter(0);hint('⏮ 第一章');break;
    case'End':e.preventDefault();if(G.library[G.cur])showChapter(G.library[G.cur].chapters.length-1);hint('⏭ 末章');break;
    case't':case'T':togSB();break;
    case's':case'S':togTTS();break;
    case'AudioVolumeDown':e.preventDefault();showChapter(G.idx-1);hint('← 上一章');break;
    case'AudioVolumeUp':e.preventDefault();showChapter(G.idx+1);hint('→ 下一章');break;
    case'MediaTrackPrevious':e.preventDefault();showChapter(G.idx-1);hint('← 上一章');break;
    case'MediaTrackNext':e.preventDefault();showChapter(G.idx+1);hint('→ 下一章');break;
  }
});

  });
}
if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=fillVoices;
setTimeout(fillVoices,500);
$('trate').addEventListener('input',function(){$('rv').textContent=parseFloat(this.value).toFixed(1);});
$('tpitch').addEventListener('input',function(){$('pv').textContent=parseFloat(this.value).toFixed(1);});
$('tvol').addEventListener('input',function(){$('vv').textContent=parseFloat(this.value).toFixed(1);});
function togTTS(){G.ttsOn?stopTTS():startTTS();}
function startTTS(){
  if(G.cur<0||!G.library[G.cur])return;
  speechSynthesis.cancel();
  var ch=G.library[G.cur].chapters[G.idx];
  var text=(ch.content||ch.title||'').replace(/\n/g,'。');
  if(!text)return;
  var u=new SpeechSynthesisUtterance(text);
  var v=speechSynthesis.getVoices().find(function(x){return x.name===$('tvsel').value;});
  if(v)u.voice=v;
  u.rate=parseFloat($('trate').value);u.pitch=parseFloat($('tpitch').value);u.volume=parseFloat($('tvol').value);
  u.onend=function(){G.ttsOn=false;$('tplaybtn').textContent='▶ 開始朗讀';$('btts').classList.remove('on');};
  speechSynthesis.speak(u);G.ttsOn=true;$('tplaybtn').textContent='⏹ 停止朗讀';$('btts').classList.add('on');
}
function stopTTS(){speechSynthesis.cancel();G.ttsOn=false;$('tplaybtn').textContent='▶ 開始朗讀';$('btts').classList.remove('on');}

// ═══════════════════════════════════════════════════════════════
// Settings
// ═══════════════════════════════════════════════════════════════
$('bset').addEventListener('click',function(){$('setp').classList.toggle('show');$('ttp').classList.remove('show');$('expp').classList.remove('show');});
$('fsr').addEventListener('input',function(){$('fsv').textContent=this.value;document.documentElement.style.setProperty('--fs',this.value+'px');localStorage.setItem('nr_fs',this.value);});
$('lhr').addEventListener('input',function(){$('lhv').textContent=parseFloat(this.value).toFixed(1);document.documentElement.style.setProperty('--lh',this.value);localStorage.setItem('nr_lh',this.value);});
$('pmr').addEventListener('input',function(){$('pmv').textContent=this.value;document.documentElement.style.setProperty('--pm',this.value+'px');localStorage.setItem('nr_pm',this.value);});
document.querySelectorAll('.thb').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.thb').forEach(function(x){x.classList.remove('on');});
    this.classList.add('on');
    document.body.className=this.dataset.th;
    localStorage.setItem('nr_th',this.dataset.th);
    // Clear custom bg when switching theme
    document.querySelectorAll('.cbtn').forEach(function(c){c.classList.remove('on');});
    localStorage.removeItem('nr_bg');
  });
});
// Custom background color
document.querySelectorAll('.cbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('on');});
    this.classList.add('on');
    var bg=this.dataset.bg;
    if(bg){ document.documentElement.style.setProperty('--bg',bg); localStorage.setItem('nr_bg',bg); }
    else { document.documentElement.style.removeProperty('--bg'); localStorage.removeItem('nr_bg'); }
  });
});
$('custom-bg').addEventListener('input',function(){
  document.querySelectorAll('.cbtn').forEach(function(x){x.classList.remove('on');});
  document.documentElement.style.setProperty('--bg',this.value);
  localStorage.setItem('nr_bg',this.value);
});

// ═══════════════════════════════════════════════════════════════
// Export / Import
// ═══════════════════════════════════════════════════════════════
$('bexp').addEventListener('click',function(){$('expp').classList.toggle('show');$('ttp').classList.remove('show');$('setp').classList.remove('show');});

function updateExpSel() {
  var sel=$('exp-sel'); sel.innerHTML='<option value="all">全部小說 ('+G.library.length+'本)</option>';
  G.library.forEach(function(n,i){
    var o=document.createElement('option');o.value=i;o.textContent=n.title;sel.appendChild(o);
  });
}

window.doExport = function() {
  var sel=$('exp-sel').value;
  var data, fname;
  if (sel==='all') {
    data={version:2, library:G.library, read:G.read, exportedAt:new Date().toISOString()};
    fname='novels_all_'+new Date().toISOString().substring(0,10)+'.json';
  } else {
    var i=parseInt(sel);
    data={version:2, library:[G.library[i]], read:{0:G.read[i]||[]}, exportedAt:new Date().toISOString()};
    fname=(G.library[i].title||'novel').replace(/[\/\\:*?"<>|]/g,'_')+'_'+new Date().toISOString().substring(0,10)+'.json';
  }
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
  $('exp-stat').textContent='✅ 已匯出 '+fname;
};

$('imp-file').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try {
      var data=JSON.parse(ev.target.result);
      var novels=data.library||[];
      if(!novels.length) throw new Error('無小說資料');
      var added=0;
      novels.forEach(function(n,i){
        if(n&&n.title&&n.chapters){
          G.library.push(n);
          if(data.read&&data.read[i]) G.read[G.library.length-1]=data.read[i];
          added++;
        }
      });
      updateExpSel(); save();
      $('exp-stat').textContent='✅ 匯入 '+added+' 本小說';
      if(added>0){ switchNovel(G.library.length-1); }
    } catch(e2) {
      $('exp-stat').textContent='❌ 匯入失敗：'+e2.message;
    }
  };
  reader.readAsText(file);
  this.value='';
});

// ═══════════════════════════════════════════════════════════════
// Close panels on outside click
// ═══════════════════════════════════════════════════════════════
document.addEventListener('click',function(e){
  var panels=[['ttp','btts'],['setp','bset'],['expp','bexp']];
  panels.forEach(function(p){
    if(!$(p[0]).contains(e.target)&&!$(p[1]).contains(e.target)) $(p[0]).classList.remove('show');
  });
});

// ═══════════════════════════════════════════════════════════════
// Persist
// ═══════════════════════════════════════════════════════════════
function save() {
  try {
    var data={library:G.library,cur:G.cur,idx:G.idx,read:G.read};
    localStorage.setItem(SK,JSON.stringify(data));
  } catch(e) {
    // Storage full: save without chapter content
    try {
      var slim={
        library:G.library.map(function(n){return{title:n.title,url:n.url||'',chapters:n.chapters.map(function(c){return{title:c.title,url:c.url||'',content:null};})};  }),
        cur:G.cur,idx:G.idx,read:G.read
      };
      localStorage.setItem(SK,JSON.stringify(slim));
    } catch(e2){}
  }
}

function restore() {
  // Settings
  var th=localStorage.getItem('nr_th')||'';
  document.body.className=th;
  document.querySelectorAll('.thb').forEach(function(b){b.classList.toggle('on',b.dataset.th===th);});
  var fs=localStorage.getItem('nr_fs');
  if(fs){$('fsr').value=fs;$('fsv').textContent=fs;document.documentElement.style.setProperty('--fs',fs+'px');}
  var lh=localStorage.getItem('nr_lh');
  if(lh){$('lhr').value=lh;$('lhv').textContent=parseFloat(lh).toFixed(1);document.documentElement.style.setProperty('--lh',lh);}
  var pm=localStorage.getItem('nr_pm');
  if(pm){$('pmr').value=pm;$('pmv').textContent=pm;document.documentElement.style.setProperty('--pm',pm+'px');}
  var bg=localStorage.getItem('nr_bg');
  if(bg){document.documentElement.style.setProperty('--bg',bg);$('custom-bg').value=bg;}

  // Library
  try {
    var raw=localStorage.getItem(SK);
    if(!raw) return;
    var x=JSON.parse(raw);
    if(x.library&&x.library.length){
      G.library=x.library; G.read=x.read||{}; G.cur=x.cur||0; G.idx=x.idx||0;
      updateExpSel();
      if(G.library[G.cur]){
        $('ns').textContent=G.library[G.cur].title.length>14?G.library[G.cur].title.substring(0,14)+'…':G.library[G.cur].title;
        buildTOC(); showChapter(G.idx);
        $('wc').style.display='none'; $('rc').style.display='block';
        // Show badge if chapters still loading (content=null)
        var nullCount=G.library[G.cur].chapters.filter(function(c){return c.content===null;}).length;
        if(nullCount>0) setBadge('loading',nullCount+'章未載入');
      }
    }
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════
restore();
$('rw').focus();
</script>
