<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>📖 小說閱讀器</title>
<style>
:root{--bg:#f5f0e8;--sf:#ede7db;--pn:#e4ddd0;--bd:#d0c8b8;--ac:#8b6914;--ac2:#a07820;--tx:#2a2018;--txd:#7a6e5f;--txr:#b8aa98;--err:#c05050;--ok:#4a9060;--warn:#9a7820;--serif:'Georgia','Songti SC','Noto Serif TC',serif;--ui:-apple-system,'PingFang TC','Segoe UI',sans-serif;--sw:270px;--pm:680px;--fs:18px;--lh:1.95;--safe-b:env(safe-area-inset-bottom,0px)}
body.dk{--bg:#1c1812;--sf:#252018;--pn:#2e2820;--bd:#3e3828;--ac:#c9a96e;--tx:#ede3d5;--txd:#9a8f82;--txr:#504540}
body.ge{--bg:#d4ecd4;--sf:#c8e4c8;--pn:#bcdabc;--bd:#a0caa0;--ac:#2a6a2a;--tx:#0a200a;--txd:#3a6a3a;--txr:#6a9a6a}
body.sp{--bg:#f2e8d8;--sf:#e8dccc;--pn:#ddd0bc;--bd:#c8bca8;--ac:#7a4e18;--tx:#2a1808;--txd:#6a5040;--txr:#a89080}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);-webkit-text-size-adjust:100%}
#app{display:flex;height:100%;height:100dvh}
#sb{width:var(--sw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .26s ease;z-index:20}
#sb.col{transform:translateX(-100%);position:absolute;height:100%}
#sbh{padding:14px 12px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px}
#sbh h1{font-size:13px;font-weight:700;color:var(--ac);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#fetch-badge{font-size:10px;padding:2px 6px;border-radius:8px;white-space:nowrap;flex-shrink:0;display:none}
#fetch-badge.loading{background:rgba(139,105,20,.15);color:var(--warn);display:inline-block}
#fetch-badge.done{background:rgba(74,144,96,.15);color:var(--ok);display:inline-block}
#fetch-badge.err{background:rgba(192,80,80,.15);color:var(--err);display:inline-block}
#tcq{margin:8px 10px;padding:8px 12px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:15px;outline:none;width:calc(100% - 20px);-webkit-appearance:none}
#tcq:focus{border-color:var(--ac)}
#tcl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0}
.ti{padding:11px 13px;cursor:pointer;color:var(--tx);border-left:3px solid transparent;user-select:none;display:flex;align-items:center;gap:6px}
.ti:active{background:var(--pn)}
.ti.active{border-left-color:var(--ac);color:var(--ac);background:var(--pn);font-weight:700}
.ti.read{color:var(--txr)}
.ti.loading{color:var(--warn)}
.ti-body{flex:1;overflow:hidden}
.ti-meta{font-size:11px;color:var(--txr);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.ti-check{color:var(--ok);font-weight:700}
.ti-title{font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.35}
.ti-del{font-size:14px;padding:2px 5px;cursor:pointer;opacity:0;flex-shrink:0;color:var(--err)}
.ti:hover .ti-del{opacity:.7}
.ti-del:hover{opacity:1}
#sbf{padding:9px 12px;border-top:1px solid var(--bd);font-size:13px;color:var(--txd);text-align:center;padding-bottom:calc(9px + var(--safe-b))}
#mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:50px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:4px;padding:0 10px;flex-shrink:0}
.btn{background:none;border:1px solid var(--bd);color:var(--txd);padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap;-webkit-appearance:none;user-select:none;transition:all .12s}
.btn:active,.btn:hover{color:var(--tx);border-color:var(--ac)}
.btn.on{color:var(--ac);border-color:var(--ac);background:rgba(139,105,20,.1)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 2px;flex-shrink:0}
#chtl{flex:1;font-size:13px;color:var(--txd);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
#rw{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
#rw::-webkit-scrollbar{display:none}
#rc{display:none;max-width:var(--pm);margin:0 auto;padding:32px 24px 100px}
#chhd{font-size:19px;font-family:var(--serif);color:var(--ac);margin-bottom:22px;line-height:1.5;text-align:center;border-bottom:1px solid var(--bd);padding-bottom:14px}
#nt{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx)}
#nt p{margin-bottom:.85em;text-indent:2em}
#wc{max-width:580px;margin:0 auto;padding:20px 16px;padding-bottom:calc(20px + var(--safe-b))}
.wlogo{font-size:44px;text-align:center;margin-bottom:8px}
.wtitle{font-size:20px;color:var(--ac);font-family:var(--serif);text-align:center;margin-bottom:16px;font-weight:700}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:11px;padding:15px;margin-bottom:10px}
.card h3{font-size:13px;color:var(--ac);margin-bottom:11px;font-weight:700}
.inp{flex:1;padding:10px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;outline:none;-webkit-appearance:none;min-width:0}
.inp:focus{border-color:var(--ac)}
.irow{display:flex;gap:7px;margin-bottom:9px}
.gbtn{padding:10px 15px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;-webkit-appearance:none;user-select:none;flex-shrink:0}
.gbtn:active{opacity:.8}
.gbtn.full{width:100%;padding:12px;font-size:14px;border-radius:9px;margin-top:2px}
#flog{background:var(--pn);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;font-size:12px;color:var(--txd);max-height:130px;overflow-y:auto;display:none;line-height:1.65}
#fprogw{width:100%;height:4px;background:var(--bd);border-radius:2px;margin:7px 0;display:none}
#fprogf{height:100%;background:var(--ac);border-radius:2px;transition:width .35s;width:0%}
#pa{width:100%;height:130px;background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:9px;font-size:12.5px;resize:none;outline:none;display:block;-webkit-appearance:none;margin-bottom:8px}
#pa:focus{border-color:var(--ac)}
#pstat{font-size:12.5px;min-height:18px;margin-top:7px;color:var(--txd)}
#pstat.ok{color:var(--ok)}#pstat.err{color:var(--err)}
.bkl-wrap{text-align:center;margin-top:11px}
#bkl{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;background:var(--ac);color:#fff;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none}
.bkl-note{font-size:11px;color:var(--txr);margin-top:5px}
#bb{height:calc(52px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 13px;padding-bottom:var(--safe-b);flex-shrink:0}
.nb{background:var(--pn);border:1px solid var(--bd);color:var(--txd);padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;-webkit-appearance:none;user-select:none}
.nb:active{background:var(--ac);color:#fff;border-color:var(--ac)}
.nb:disabled{opacity:.25;pointer-events:none}
#pind{font-size:12px;color:var(--txd);text-align:center}
#pgw{width:90px;height:3px;background:var(--bd);border-radius:2px;margin-top:4px}
#pg{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
#pw{display:none;height:100%;flex-direction:column;overflow:hidden;position:relative}
#pscreen{flex:1;display:flex;flex-direction:column;padding:28px 26px 0;overflow:hidden;transition:transform .18s ease;will-change:transform}
@media(max-width:680px){#pscreen{padding:18px 16px 0}}
#pchtitle{font-size:13px;color:var(--txd);text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-shrink:0}
#ptext{font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);color:var(--tx);flex:1;overflow:hidden}
#ptext p{margin-bottom:.85em;text-indent:2em}
#pnav{height:calc(58px + var(--safe-b));background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-bottom:var(--safe-b);flex-shrink:0;gap:10px}
.pnb{background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:9px 20px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:700;-webkit-appearance:none;user-select:none;white-space:nowrap;flex-shrink:0}
.pnb:active{background:var(--ac);color:#fff;border-color:var(--ac)}
.pnb:disabled{opacity:.2;pointer-events:none}
#pmid{text-align:center;flex:1;min-width:0}
#pmid-ch{font-size:12px;color:var(--txd);margin-bottom:2px}
#pmid-pg{font-size:11px;color:var(--txr)}
#pdots{display:flex;gap:3px;align-items:center;justify-content:center;margin-top:3px}
.pdot{width:4px;height:4px;border-radius:50%;background:var(--bd)}
.pdot.on{background:var(--ac);width:6px;height:6px}
#tap-l{position:absolute;left:0;top:0;width:28%;height:calc(100% - 58px - var(--safe-b));z-index:5;cursor:pointer}
#tap-r{position:absolute;right:0;top:0;width:28%;height:calc(100% - 58px - var(--safe-b));z-index:5;cursor:pointer}
.panel{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:15px;box-shadow:0 6px 28px rgba(0,0,0,.15);display:none;z-index:40}
.panel.show{display:block}
.panel h4{font-size:13px;color:var(--ac);margin-bottom:12px;font-weight:700}
#ttp{bottom:68px;right:12px;width:228px}
#setp{top:58px;right:12px;width:252px}
#expp{top:58px;right:12px;width:272px}
#editp{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#editp.show{display:flex}
#edit-box{background:var(--sf);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
#edit-box h4{font-size:16px;font-weight:700;color:var(--ac);margin-bottom:14px}
.ef{margin-bottom:10px}
.ef label{font-size:12px;color:var(--txd);display:block;margin-bottom:4px;font-weight:600}
.ef input,.ef textarea{width:100%;padding:9px 11px;background:var(--pn);border:1px solid var(--bd);border-radius:7px;color:var(--tx);font-size:14px;outline:none;-webkit-appearance:none}
.ef textarea{height:80px;resize:none;font-family:var(--ui)}
.ef input:focus,.ef textarea:focus{border-color:var(--ac)}
.edit-chlist{max-height:220px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;background:var(--pn);margin-top:6px}
.ech-row{display:flex;align-items:center;padding:8px 11px;border-bottom:1px solid var(--bd);gap:8px}
.ech-row:last-child{border-bottom:none}
.ech-num{font-size:11px;color:var(--txr);width:30px;flex-shrink:0}
.ech-title{flex:1;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ech-del{background:none;border:none;cursor:pointer;font-size:16px;color:var(--err);opacity:.6;flex-shrink:0;padding:2px 4px}
.ech-del:hover{opacity:1}
.edit-btns{display:flex;gap:8px;margin-top:14px}
.edit-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.tr{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;color:var(--txd)}
.tr label{width:46px;flex-shrink:0}
.tr input[type=range]{flex:1;accent-color:var(--ac);height:20px}
.tr span{width:30px;text-align:right;font-size:11px;color:var(--tx)}
#tvsel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:5px 8px;border-radius:6px;font-size:12px;margin-bottom:9px;outline:none;-webkit-appearance:none}
#tplaybtn{width:100%;padding:8px;background:var(--ac);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.srow{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12.5px;color:var(--txd)}
.srow label{flex:1}
.srow input[type=range]{width:82px;accent-color:var(--ac);height:20px}
.srow span{width:30px;font-size:11px;color:var(--tx);text-align:right}
.thr{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.thb{padding:5px 10px;border-radius:6px;border:1px solid var(--bd);font-size:12px;cursor:pointer;background:var(--pn);color:var(--txd);-webkit-appearance:none}
.thb.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.cbtn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.cbtn.on{border-color:var(--ac)}
.exp-sel{width:100%;background:var(--pn);border:1px solid var(--bd);color:var(--tx);padding:7px 9px;border-radius:7px;font-size:13px;outline:none;-webkit-appearance:none;margin-bottom:10px}
.exp-btns{display:flex;gap:7px}
.exp-btns button{flex:1;padding:9px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none}
#exp-stat{font-size:12px;color:var(--txd);margin-top:8px;min-height:16px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
#overlay.show{display:block}
#kh{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;border-radius:6px;padding:5px 13px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:50;white-space:nowrap}
#kh.show{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;margin-right:3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:680px){:root{--sw:82vw;--fs:16px}#sb{position:absolute;height:100%;transform:translateX(-110%)}#sb.open{transform:translateX(0)}#rc{padding:22px 15px 100px}#setp,#expp{top:auto;bottom:68px;right:12px;left:12px;width:auto}}
</style>
</head>
<body>
<div id="overlay" onclick="closeSB()"></div>
<div id="app">
<div id="sb">
  <div id="sbh"><span>📚</span><h1 id="ns">小說閱讀器</h1><span id="fetch-badge"></span></div>
  <input id="tcq" type="search" placeholder="搜尋章節…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="tcl"></div>
  <div id="sbf">0 / 0 章</div>
</div>
<div id="mn">
  <div id="topbar">
    <button class="btn" id="btoc">☰</button>
    <div class="sep"></div>
    <button class="btn" id="bnew">＋ 新書</button>
    <button class="btn" id="bedit">✏️ 編輯</button>
    <div class="sep"></div>
    <div id="chtl">—</div>
    <div class="sep"></div>
    <button class="btn" id="bpm">📄 分頁</button>
    <button class="btn" id="btts">🔊</button>
    <button class="btn" id="bset">⚙</button>
    <button class="btn" id="bexp">📦</button>
  </div>
  <div id="rw" tabindex="0">
    <div id="wc">
      <div class="wlogo">📖</div>
      <div class="wtitle">小說閱讀器</div>
      <div class="card">
        <h3>🔗 自動抓取（輸入網址）</h3>
        <div class="irow"><input class="inp" id="urlin" type="url" placeholder="https://www.xbanxia.cc/books/12345.html" autocorrect="off" autocapitalize="off" spellcheck="false"><button class="gbtn" id="fetchbtn">抓取</button></div>
        <div id="fprogw"><div id="fprogf"></div></div>
        <div id="flog"></div>
      </div>
      <div class="card">
        <h3>🔖 書籤工具（複製小說文字用）</h3>
        <div style="font-size:13px;color:var(--txd);line-height:1.7;margin-bottom:10px">
          把下方按鈕<strong style="color:var(--tx)">長按 → 加入書籤</strong>到 Safari 書籤列。<br>
          之後到任何小說章節頁，點一下書籤即可自動複製全頁文字。
        </div>
        <div class="bkl-wrap"><a id="bkl" href="#BKL">📖 複製小說文字</a><div class="bkl-note">← 長按此按鈕加入書籤列</div></div>
      </div>
    </div>
    <div id="rc"><div id="chhd"></div><div id="nt"></div></div>
    <div id="pw">
      <div id="tap-l" onclick="pagePrev()"></div>
      <div id="tap-r" onclick="pageNext()"></div>
      <div id="pscreen"><div id="pchtitle"></div><div id="ptext"></div></div>
      <div id="pnav">
        <button class="pnb" id="pnavprev" onclick="pagePrev()">← 上一頁</button>
        <div id="pmid"><div id="pmid-ch"></div><div id="pmid-pg"></div><div id="pdots"></div></div>
        <button class="pnb" id="pnavnext" onclick="pageNext()">下一頁 →</button>
      </div>
    </div>
  </div>
  <div id="bb">
    <button class="nb" id="pvbtn">← 上章</button>
    <div><div id="pind">—</div><div id="pgw"><div id="pg" style="width:0%"></div></div></div>
    <button class="nb" id="nxbtn">下章 →</button>
  </div>
</div>
</div>
<div id="ttp" class="panel"><h4>🔊 語音朗讀</h4><select id="tvsel"></select><div class="tr"><label>語速</label><input type="range" id="trate" min="0.5" max="2.5" step="0.1" value="1.0"><span id="rv">1.0</span></div><div class="tr"><label>音調</label><input type="range" id="tpitch" min="0.5" max="2" step="0.1" value="1.0"><span id="pv">1.0</span></div><div class="tr"><label>音量</label><input type="range" id="tvol" min="0" max="1" step="0.05" value="1.0"><span id="vv">1.0</span></div><button id="tplaybtn">▶ 開始朗讀</button></div>
<div id="setp" class="panel"><h4>⚙ 閱讀設定</h4><div class="srow"><label>字體大小</label><input type="range" id="fsr" min="13" max="32" step="1" value="18"><span id="fsv">18</span></div><div class="srow"><label>行距</label><input type="range" id="lhr" min="1.4" max="3.0" step="0.1" value="1.95"><span id="lhv">1.9</span></div><div class="srow"><label>頁面寬度</label><input type="range" id="pmr" min="380" max="900" step="20" value="680"><span id="pmv" style="width:36px">680</span></div><div class="srow" style="flex-direction:column;align-items:flex-start;gap:5px"><label>主題</label><div class="thr"><button class="thb on" data-th="">☀️ 日間</button><button class="thb" data-th="sp">📜 古典</button><button class="thb" data-th="ge">🌿 護眼</button><button class="thb" data-th="dk">🌙 夜間</button></div></div><div class="srow" style="flex-direction:column;align-items:flex-start;gap:5px"><label>自訂底色</label><div class="color-row"><div class="cbtn" data-bg="" style="background:#f5f0e8;border:2px solid #ccc"></div><div class="cbtn" data-bg="#fffef5" style="background:#fffef5"></div><div class="cbtn" data-bg="#e8f0e8" style="background:#e8f0e8"></div><div class="cbtn" data-bg="#e8eaf5" style="background:#e8eaf5"></div><div class="cbtn" data-bg="#f5e8f0" style="background:#f5e8f0"></div><input type="color" id="custom-bg" value="#f5f0e8" style="width:36px;height:26px;border-radius:5px;border:1px solid var(--bd);cursor:pointer;padding:0"></div></div></div>
<div id="expp" class="panel"><h4>📦 匯出 / 匯入</h4><select class="exp-sel" id="exp-sel"><option value="all">全部小說</option></select><div class="exp-btns"><button onclick="doExport()" style="background:var(--ac);color:#fff">⬆️ 匯出</button><button onclick="$('imp-file').click()" style="background:var(--pn);color:var(--txd);border:1px solid var(--bd)">⬇️ 匯入</button></div><input type="file" id="imp-file" accept=".json" style="display:none"><div id="exp-stat"></div></div>

// ── iPad BT keyboard fix ──────────────────────────────
// iPad Safari intercepts many keys; we use multiple strategies:
// 1. keydown on document (capture phase)
// 2. keyup as fallback
// 3. A hidden always-focused input to catch keys on iOS
// 4. Handle both e.key strings AND e.keyCode numbers

function handleKey(key, code, preventDefault) {
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (['INPUT','TEXTAREA','SELECT'].includes(tag) && document.activeElement.id !== 'kb-trap') return;
  var handled = true;
  if (PM.on) {
    // Page mode keys
    if (key==='ArrowLeft'||key==='ArrowUp'||key==='PageUp'||code===37||code===38||code===33) { pagePrev(); }
    else if (key==='ArrowRight'||key==='ArrowDown'||key===' '||key==='PageDown'||code===39||code===40||code===32||code===34) { pageNext(); }
    else if (key==='AudioVolumeDown'||code===174) { pagePrev(); }
    else if (key==='AudioVolumeUp'||code===175) { pageNext(); }
    else if (key==='MediaTrackPrevious'||code===177) { pagePrev(); }
    else if (key==='MediaTrackNext'||code===176) { pageNext(); }
    else if (key==='t'||key==='T') { togSB(); }
    else { handled = false; }
  } else {
    if (key==='ArrowLeft'||code===37) { showChapter(G.idx-1); hint('← 上一章'); }
    else if (key==='ArrowRight'||code===39) { showChapter(G.idx+1); hint('→ 下一章'); }
    else if (key==='ArrowUp'||code===38) { $('rw').scrollBy({top:-70,behavior:'smooth'}); }
    else if (key==='ArrowDown'||code===40) { $('rw').scrollBy({top:70,behavior:'smooth'}); }
    else if (key===' '||key==='PageDown'||code===32||code===34) { $('rw').scrollBy({top:$('rw').clientHeight*.8,behavior:'smooth'}); }
    else if (key==='PageUp'||code===33) { $('rw').scrollBy({top:-$('rw').clientHeight*.8,behavior:'smooth'}); }
    else if (key==='Home'||code===36) { showChapter(0); }
    else if (key==='End'||code===35) { if(G.library[G.cur])showChapter(G.library[G.cur].chapters.length-1); }
    else if (key==='t'||key==='T') { togSB(); }
    else if (key==='s'||key==='S') { togTTS(); }
    else if (key==='AudioVolumeDown'||code===174) { showChapter(G.idx-1); }
    else if (key==='AudioVolumeUp'||code===175) { showChapter(G.idx+1); }
    else if (key==='MediaTrackPrevious'||code===177) { showChapter(G.idx-1); }
    else if (key==='MediaTrackNext'||code===176) { showChapter(G.idx+1); }
    else { handled = false; }
  }
  if (handled && preventDefault) preventDefault();
}

// Primary: keydown capture phase
// keydownHandled prevents keyup from double-firing on desktop
var keydownHandled = false;
document.addEventListener('keydown', function(e) {
  var skip = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.activeElement.id !== 'kb-trap';
  if (!skip) {
    keydownHandled = true;
    handleKey(e.key, e.keyCode||e.which, function(){ e.preventDefault(); e.stopPropagation(); });
  } else { keydownHandled = false; }
}, true);

// Fallback: keyup — only fires if keydown was NOT handled (iPad-only path)
document.addEventListener('keyup', function(e) {
  if (keydownHandled) { keydownHandled = false; return; } // desktop: already handled
  var skip = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.activeElement.id !== 'kb-trap';
  if (!skip) { handleKey(e.key, e.keyCode||e.which, null); }
  keydownHandled = false;
}, true);

// ── Hidden focus trap for iPad ─────────────────────────
// On iPad, keyboard events only fire if something is focused.
// We keep a hidden input focused at all times when not in a real input.
var kbTrap = document.createElement('input');
kbTrap.id = 'kb-trap';
kbTrap.setAttribute('type', 'text');
kbTrap.setAttribute('autocomplete', 'off');
kbTrap.setAttribute('autocorrect', 'off');
kbTrap.setAttribute('autocapitalize', 'off');
kbTrap.setAttribute('spellcheck', 'false');
kbTrap.setAttribute('readonly', 'true');
kbTrap.style.cssText = 'position:fixed;opacity:0;width:1px;height:1px;top:0;left:0;pointer-events:none;z-index:-1;font-size:16px;border:none;outline:none;background:transparent;color:transparent;';
document.body.appendChild(kbTrap);

// The trap listens for keydown/keyup itself too
kbTrap.addEventListener('keydown', function(e) {
  keydownHandled = true;
  handleKey(e.key, e.keyCode||e.which, function(){ e.preventDefault(); });
}, true);
kbTrap.addEventListener('keyup', function(e) {
  if (keydownHandled) { keydownHandled = false; return; }
  handleKey(e.key, e.keyCode||e.which, null);
  keydownHandled = false;
}, true);

// Keep trap focused whenever user is not in a real input
function refocusTrap() {
  var active = document.activeElement;
  if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA' && active.tagName !== 'SELECT') || active.id === 'kb-trap') {
    // Only refocus if no panel input is focused
    kbTrap.focus({ preventScroll: true });
  }
}
// Refocus on any click/touch in the reading area
$('rw').addEventListener('click', refocusTrap);
$('pw').addEventListener('click', function(e) {
  // Don't steal focus from nav buttons
  if (!e.target.closest('.pnb') && !e.target.closest('#tap-l') && !e.target.closest('#tap-r')) refocusTrap();
});
$('pw').addEventListener('touchend', function(e) {
  if (!e.target.closest('.pnb')) setTimeout(refocusTrap, 50);
}, {passive:true});
document.addEventListener('click', function(e) {
  // Refocus unless user clicked an input/textarea/button inside a panel
  if (!e.target.closest('input') && !e.target.closest('textarea') && !e.target.closest('select')) {
    setTimeout(refocusTrap, 50);
  }
});
// Refocus when trap loses focus (unless going to real input)
kbTrap.addEventListener('blur', function() {
  setTimeout(function() {
    var active = document.activeElement;
    if (!active || active.id === kbTrap.id) return;
    if (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA' && active.tagName !== 'SELECT') {
      refocusTrap();
    }
  }, 100);
});

window.doExport=function(){

$('imp-file').addEventListener('change',function(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){try{
